schema: spec-driven

context: |
  # IEFA Monorepo

  O contexto do repo — apps, packages, convenções, design systems, workflow — mora
  em CLAUDE.md na raiz. Leia de lá; esta chave existia como uma segunda cópia da
  mesma coisa e as duas divergiram (as duas ainda listavam 6 apps quando já eram 10).

  ## Language
  - Codebase: English (code) + Portuguese-BR (user-facing, docs, specs)

rules:
  proposal:
    - Write in Portuguese-BR
    - Always include a "Não-objetivos" (Non-goals) section
    - Reference which app(s) the change affects — a lista está em CLAUDE.md
  design:
    - Write in Portuguese-BR
    - Reference existing patterns in the codebase when applicable
    - Mention DB schema changes if any (Supabase migration needed)
  tasks:
    - Write in Portuguese-BR
    - Break tasks into chunks of max 2 hours
    - Prefix each task with the affected app/package scope [sisub], [api], etc.
    - Include a final task for Biome check (`bun run check`)
