##
# Linguagem ubíqua do sisub (change `sisub-ubiquitous-language`, D8): o nome descartado de um lote
# concluído não volta. Cada regra aponta o nome do glossário
# (`openspec/changes/sisub-ubiquitous-language/specs/ubiquitous-language/spec.md`).
#
# A lista cresce por lote. Termo ainda em uso não entra, senão o gate nasce vermelho: os valores de
# domínio do lote 5 (`product`, `exception`, os papéis e os tipos de inventário em inglês) entram
# com o contract dele, e "rancho" no lote 8a (fora do efetivo) e no 8b (o efetivo). As migrations
# novas têm regra própria em `ubiquitous-language-sql.yaml`.
#
# Linha de comentário não é acusada (`pattern-not-regex` da linha inteira): comentário cita o nome
# antigo para contar a história do rename. Os casos de teste de cada regra estão em
# `__fixtures__/ubiquitous-language.ts` (`opengrep test`, comando no cabeçalho de lá).
#
# Regras compatíveis com Opengrep e Semgrep (mesma sintaxe).
##
rules:
  - id: ubiquitous-language-lot1-identifier
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub. Previsão de demanda é `demand_forecast`
      (`DemandForecast`, `demandForecast*`, `forecastId`, arquivos `demand-forecast*`), não
      `KitchenAtaDraft`/`kitchenDraft`/`kitchen-draft`. Liquidação e pagamento são `liquidacao` e
      `pagamento` (Lei 4.320, arts. 62-65; `liquidation` é falso cognato e `pagamento` fica com
      `empenho` e `liquidacao`); o recolhimento da retenção é `remittance`. A preparação herdada do
      SISUBWEB é `legacy_preparation` (tool `list_legacy_preparations`).
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
        - "apps/api/src/**/*.ts"
        - "packages/database/src/sisub.ts"
      exclude:
        - "**/routeTree.gen.ts"
        - "**/generated.ts"
        - "**/drizzle/**"
    patterns:
      - pattern-regex: \b(?:\w*KitchenAtaDraft\w*|\w*[kK]itchenDrafts?\w*|kitchen-draft|kitchen_ata_draft|\w*[lL]iquidations?\w*|\w*[pP]ayments?\w*|list_preparations|\w*[aA]gentListPreparations\w*)
      # Linha de comentário conta a história do rename.
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      # O registro de auditoria guarda o nome com que a linha foi gravada: o alias de leitura
      # (`RENAMED_OPERATIONS` em `assurance-registry.ts`) precisa citar o nome antigo.
      - pattern-not-regex: registerDeductionPaymentFn:\s*"registerDeductionRemittanceFn"
      # O mapa de caminhos antigos (`lib/legacy-routes.ts`) e quem o testa citam a origem como
      # `from: "<caminho antigo>"`: é o único lugar em que o nome descartado é o dado.
      - pattern-not-regex: \bfrom:\s*["'`][^"'`]*["'`]

  - id: ubiquitous-language-lot1-route
    languages: [generic]
    severity: ERROR
    message: >-
      Rota com segmento descartado pelo glossário do sisub: `suprimentos` é `demand-forecasts`,
      `weekly-plans` é `weekly-menus`, `liquidations` é `liquidacoes`, `payments` é `pagamentos`.
      O caminho antigo só existe como entrada `from` de `LEGACY_ROUTE_PREFIXES`
      (`apps/sisub/src/lib/legacy-routes.ts`), por um ciclo de deploy; link, navegação e rota nova
      usam o nome do glossário.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
      exclude:
        - "**/routeTree.gen.ts"
    patterns:
      - pattern-regex: /(?:suprimentos|weekly-plans|liquidations|payments)(?=[/"'`?#)]|$)
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      # Origem do mapa de caminhos antigos (`lib/legacy-routes.ts`) e de quem o testa: a única
      # exceção, e por conteúdo, não por caminho de arquivo.
      - pattern-not-regex: \bfrom:\s*["'`][^"'`]*["'`]

  - id: ubiquitous-language-lot1-label
    languages: [generic]
    severity: ERROR
    message: >-
      Rótulo descartado pelo glossário do sisub. Use "Cardápio(s) Semanal(is)" (não "Plano(s)
      Semanal(is)"), "Cardápios de Apoio" (não "Apoios"), "Inventário Físico" (não "Contagem
      Física"), "Pesquisa de preços" (no plural, IN SEGES/ME 65/2021), "ARP (preço registrado)" (não
      "ATA (preço homologado)": só a ARP é ata, Lei 14.133, art. 6º, XLVI), "Fiscal de rancho" para
      o módulo de presença (nunca "Fiscal" sozinho: fiscal é o do contrato, art. 117) e "quem tem
      Gestão Unidade" no lugar de "chefe do rancho".
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
      exclude:
        - "**/routeTree.gen.ts"
    patterns:
      - pattern-regex: (?:Planos? Semana(?:l|is)|["'>`]\s*Apoios\s*["'<`]|na tela, \\?"Apoio\\?"|Contagem Física|ATA \(preço homologado\)|Pesquisa de [Pp]reço\b(?!s)|Fiscal de Rancho|chefe do rancho|(?:messhall|name):\s*"Fiscal")
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$

  # ── Lote 2: anexo quantitativo ─────────────────────────────────────────────
  #
  # Na lei só a Ata de Registro de Preços é ata (Lei 14.133, art. 6º, XLVI); o anexo quantitativo
  # do TR é a estimativa das quantidades (art. 18, § 1º, IV). Ficam de fora o que é a ARP de fato:
  # o espelho do Compras.gov.br (`numeroAta`, `numeroAtaRegistroPreco`, `anoAta`, `statusAta`,
  # `numero_ata`, `ano_ata`, `status_ata`, `descricaoAta`) e os VALORES `'ata'` de
  # `acquisition.instrument` e de `opening_balance.cost_source`.

  - id: ubiquitous-language-lot2-identifier
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub: o anexo quantitativo é `quantity_estimate`
      (`QuantityEstimate*`, `quantityEstimateId`, `quantity_estimate_item_id`, arquivos
      `quantity-estimate*`), estimativa das quantidades da Lei 14.133, art. 18, § 1º, IV; ata é só
      a ARP (art. 6º, XLVI). Tabelas `procurement.quantity_estimate*`, não `procurement_list*`;
      `quantity_estimate_id`/`quantity_estimate_kitchen_id`, não `list_id`/`list_kitchen_id`.
      Acréscimo da quantidade máxima é `max_increase_percent` (margem é a de preferência, art. 26),
      a justificativa é `max_quantity_justification` e a quantidade estimada é
      `estimated_quantity`. Tools: `list_quantity_estimates`, `get_quantity_estimate`,
      `update_quantity_estimate_status`.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
        - "apps/api/src/**/*.ts"
        - "packages/database/src/sisub.ts"
      exclude:
        - "**/routeTree.gen.ts"
        - "**/generated.ts"
        - "**/drizzle/**"
        # Lê a migration histórica que criou a coluna com o nome da época.
        - "packages/sisub-domain/src/operations/quantity-estimate-limits.sql-contract.test.ts"
    patterns:
      - pattern-either:
          # Compostos: nunca aparecem em prosa.
          - pattern-regex: \b(?:\w*[a-z0-9]Atas?(?=[A-Z0-9_]|\b)\w*|Atas?[A-Z]\w*|atas?[A-Z_]\w*|ATA_\w+|\w*[pP]rocurementList\w*|procurement_list\w*|list_id|listIds?|list_kitchen_id|listKitchenIds?|max_margin_percent|\w*[mM]axMargin\w*|\w*MarginPercent\w*|MARGIN_PERCENT|margin_justification|\w*[mM]arginJustification\w*|margin_tight|margin_requires_justification|total_quantity|totalQuantity|list_atas|get_atas|get_ata_details|update_ata_status)\b
          # `ata`/`atas` sozinho só onde é identificador: declaração, acesso a membro, argumento,
          # desestruturação ou chave de objeto com valor que não é texto.
          - pattern-regex: \b(?:const|let|var|function)\s+atas?\b|\batas?(?:\?\.|\.)[A-Za-z_$]|\(\s*atas?\s*[,)]|\{\s*atas?\s*[,}]|\batas?\s*:\s*[A-Za-z_$({\[]
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      # Espelho do Compras.gov.br e do banco da ARP.
      - pattern-not-regex: \b(?:numero|ano|status|descricao|formatNumero|anoFromNumero)Ata\w*|\bnumero_ata\b|\bano_ata\b|\bstatus_ata\b|Atalho

  - id: ubiquitous-language-lot2-route
    languages: [generic]
    severity: ERROR
    message: >-
      Rota com segmento descartado pelo glossário do sisub: o anexo quantitativo mora em
      `unit/$unitId/quantity-estimates` (`/new`, `/$quantityEstimateId`,
      `/print/calculation-memory/$quantityEstimateId`, `/print/price-research/$quantityEstimateId`),
      não em `procurement`; na API admin, `/quantity-estimates/:quantityEstimateId`, não
      `/ata/:ataId`. O redirect e o alias depreciados do caminho antigo já cumpriram o ciclo e
      saíram com o contract 20260927050000.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "apps/api/src/**/*.ts"
      exclude:
        - "**/routeTree.gen.ts"
    patterns:
      - pattern-either:
          - pattern-regex: /unit(?:/[^/"'`\s]+)?/procurement(?=[/"'`?#)]|$)
          - pattern-regex: (?:\}|\$\{[^}]*\})/procurement(?=[/"'`?#)]|\$\{)
          - pattern-regex: (?:["'`])/procurement/
          - pattern-regex: /print/quantities(?=[/"'`?#)]|$)
          - pattern-regex: /ata/:\w+|/ata(?=["'`])
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$

  - id: ubiquitous-language-lot2-label
    languages: [generic]
    severity: ERROR
    message: >-
      Rótulo descartado do anexo quantitativo. O anexo é CONCLUÍDO, não "publicado" (publicar é
      divulgar no PNCP, Lei 14.133, art. 54); a folga da quantidade máxima é "acréscimo sobre a
      estimada", não "margem" (margem é a de preferência, art. 26); a base é a "quantidade
      estimada", não o "alvo" ("Qtd Alvo"); e o anexo não é "ata" nem "lista".
    paths:
      include:
        - "apps/sisub/src/components/features/local/quantity-estimate/**"
        - "apps/sisub/src/components/features/local/procurement/**"
        - "apps/sisub/src/routes/_protected/_modules/unit/$unitId/quantity-estimates/**"
        - "apps/sisub/src/routes/_protected/_modules/unit/$unitId/quantity-estimates.tsx"
        - "apps/sisub/src/lib/quantity-estimate-annex.ts"
        - "apps/sisub/src/lib/quantity-estimate-utils.ts"
        - "apps/sisub/src/lib/annex-table.ts"
        - "apps/sisub/src/hooks/data/useQuantityEstimate.ts"
        - "packages/sisub-domain/src/operations/quantity-estimate.ts"
        - "packages/sisub-domain/src/operations/quantity-estimate-limits.ts"
    patterns:
      - pattern-regex: (?i)\bmargem\b|\bpublicad[oa]s?\b|\bpublicar\b|\bpublicação\b|Qtd\.?\s+Alvo|\balvo\s+planejado\b|"published"|\bpublished\s*[:]
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      # Publicar é, de fato, divulgar no PNCP; margem de preferência é a do art. 26.
      - pattern-not-regex: (?im)^.*(?:PNCP|licitação publicada|edital|preferência).*$

  # ── Lote 3: pesquisa de preços e prefixos redundantes ─────────────────────
  #
  # A pesquisa de preços (Lei 14.133, art. 23; IN SEGES/ME 65/2021) tinha um nome em cada língua, e
  # a amostra coletada chamava-se pela API de origem. O schema já diz o domínio: `procurement.arp`,
  # não `procurement.procurement_arp`. Fica de fora o caminho do endpoint do Compras.gov.br
  # (`/modulo-pesquisa-preco/1_consultarMaterial`): é o nome do terceiro.

  - id: ubiquitous-language-lot3-identifier
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub. A pesquisa de preços é `price_research`
      (`PriceResearch*`, `priceResearch*`, tabelas `procurement.price_research`,
      `price_research_item`, `price_research_sample`, worker `workers/price-research`,
      `analyzePrices`, `savePriceResearchFn`), não `pesquisa_preco`/`PesquisaPreco`; a amostra
      coletada é `price_sample` (`PriceSample`, `priceSampleId`, `price_sample_id`, RPC
      `upsert_price_samples`), não `compras_amostra`/`AmostraPreco`/`amostra_id`. Sem prefixo
      redundante: a ARP é `procurement.arp`/`arp_item` (`Arp`, `ArpItem`, `arpInProcurement`) e a
      contratação planejada é `procurement.segment`/`segment_rule` (`Segment`, `createSegment`,
      `useSegments`), não `procurement_arp*`/`procurement_segment*`.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
        - "apps/api/src/**/*.ts"
        - "packages/database/src/sisub.ts"
      exclude:
        - "**/routeTree.gen.ts"
        - "**/generated.ts"
        - "**/drizzle/**"
    patterns:
      - pattern-regex: \b(?:\w*[pP]esquisa_?[pP]recos?\w*|pesquisa-preco|\w*[cC]ompras_?[aA]mostras?\w*|\w*[aA]mostra_?[iI]ds?\b|\w*AmostraPreco\w*|analisarPrecos|savePrecoAuditFn|OpcoesPesquisa|\w*[pP]rocurement_?[aA]rp(?![a-z])\w*|\w*[pP]rocurement_?[sS]egment\w*|procurement-segments)
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      # Endpoint do Compras.gov.br: o caminho é do terceiro.
      - pattern-not-regex: /modulo-pesquisa-preco/\w+

  # ── Lote 4: finanças ───────────────────────────────────────────────────────
  #
  # Numa UG executora não há dotação (ela é da LOA, no órgão): o que chega por NC é crédito
  # recebido, e o saldo que o SIAFI informa é o crédito disponível. A UG emitente da NE tem o nome
  # da NC (`credit_note.issuer_ug`). Fica de fora o parser do relatório do Tesouro Gerencial
  # (`apps/api/src/workers/siafi/`) e a leitura da linha parseada (`parsed.dotacao`): são as
  # colunas do relatório ("DOTAÇÃO ATUALIZADA"), layout de terceiro, e a chave fica gravada em
  # `siafi_integration.import_row.parsed` dos lotes ainda não aplicados.

  - id: ubiquitous-language-lot4-identifier
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub: o crédito que chega à UG executora por NC é
      `received_credit` (`receivedCredit`), não `dotacao` (a dotação é da LOA, no órgão); o saldo
      do SIAFI é o crédito disponível, `available_credit_siafi` (`availableCreditSiafi`), não
      `saldo_siafi`; a UG emitente da NE é `issuer_ug` (`issuerUg`), como na NC, não `ug_emitente`.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
        - "apps/api/src/**/*.ts"
        - "packages/database/src/sisub.ts"
      exclude:
        - "**/routeTree.gen.ts"
        - "**/generated.ts"
        - "**/drizzle/**"
        - "apps/api/src/workers/siafi/**"
    patterns:
      # Sem caixa: vale para `dotacao`, `saldoSiafi` e para constante em SCREAMING_SNAKE (`UG_EMITENTE`).
      - pattern-regex: (?i)\b\w*(?:dotacao|saldo_?siafi|ug_?emitente)\w*\b
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      # Chave da linha parseada do relatório do Tesouro Gerencial (ver o cabeçalho do lote).
      - pattern-not-regex: \bparsed\.dotacao\b


  # ── Lote 7: arranchamento ──────────────────────────────────────────────────
  #
  # O militar se ARRANCHA: declara que vai comer numa data, refeição e refeitório; a presença é o
  # comparecimento. "Meal forecast" é a estimativa agregada (`daily_menu.forecasted_headcount`,
  # `forecastedHeadcount`), que fica, e a previsão de demanda da cozinha (`DemandForecast`,
  # `forecastId`, `pendingForecasts`) é outro conceito: por isso a regra lista os nomes do
  # arranchamento, não a palavra `forecast`. Ficam de fora a definição do alias depreciado da API
  # (`LEGACY_ARRANCHAMENTO_PATH`, `apps/api/src/api/arranchamento-path.ts`) e o teste que prova que
  # o analytics recusa o nome antigo.

  - id: ubiquitous-language-lot7-identifier
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub: o comensal se arrancha. A tabela é
      `kitchen.arranchamento` (`arranchamentoInKitchen`, tipos `Arranchamento`,
      `ArranchamentoRecord`, `ArranchamentoHook`, `ArranchamentoMap`), não `meal_forecasts`; as
      operações são `listArranchamentos`, `upsertArranchamento`, `deleteArranchamento`,
      `listArranchamentoMap` e `fetchUserArranchamento` (server fns `*ArranchamentoFn`, hook
      `useArranchamento`, `userArranchamentoQueryOptions`); as contagens dos painéis são
      `arranchados_count`/`arranchados_users` (pessoas), `total_arranchamentos`, `arranchamentos`,
      `arranchamento_count` e `arranchamento_meals` (refeições marcadas). A API é
      `/api/arranchamentos`. "Forecast" fica só para a estimativa agregada
      (`forecasted_headcount`) e para a previsão de demanda.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
        - "apps/api/src/**/*.ts"
        - "packages/database/src/sisub.ts"
      exclude:
        - "**/routeTree.gen.ts"
        - "**/generated.ts"
        - "**/drizzle/**"
    patterns:
      - pattern-regex: \b(?:\w*[mM]ealForecasts?\w*|meal_forecasts?|MEAL_FORECASTS?|ForecastRecords?|[uU]psertForecast(?:Fn|Schema)?|deleteForecastFn|DeleteForecast(?:Schema)?|[lL]istForecastMap(?:Schema)?|ForecastMap|forecastMap|systemForecast|loadExistingForecasts|fetchForecastsFn|forecast_count|forecast_users|total_forecast|forecast_meals|rancho_previsoes)\b
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      # A definição do alias depreciado da API: o único lugar em que o caminho antigo é o dado.
      - pattern-not-regex: \bLEGACY_ARRANCHAMENTO_PATH\s*=\s*"/rancho_previsoes"
      # O teste do analytics prova que o nome antigo da tabela é recusado.
      - pattern-not-regex: (?m)^.*\bvalidateSql\(.*$
      - pattern-not-regex: Tabela não permitida:\s*\w+

  - id: ubiquitous-language-lot7-route
    languages: [generic]
    severity: ERROR
    message: >-
      Rota com segmento descartado pelo glossário do sisub: a tela do comensal é
      `/diner/arranchamento`, não `/diner/forecast`; na API, `/api/arranchamentos`. O caminho antigo
      só existe como entrada `from` de `LEGACY_ROUTE_PREFIXES` (`apps/sisub/src/lib/legacy-routes.ts`)
      e como o alias depreciado da API (`LEGACY_ARRANCHAMENTO_PATH`), até o mantenedor retirá-los.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "apps/api/src/**/*.ts"
      exclude:
        - "**/routeTree.gen.ts"
    patterns:
      - pattern-regex: /diner/forecast(?=[/"'`?#)]|$)
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      - pattern-not-regex: \bfrom:\s*["'`][^"'`]*["'`]

  - id: ubiquitous-language-lot7-label
    languages: [generic]
    severity: ERROR
    message: >-
      Rótulo descartado do arranchamento. A tela do comensal é "Arranchamento" (quem marca que vai
      comer está "arranchado"; `will_eat = false` é "desarranchado"), e o painel compara
      arranchados com presentes. "Previsão" é a estimativa agregada de comensais
      (`forecasted_headcount`) e a previsão de demanda da cozinha; na busca do menu a palavra
      pode ficar como palavra-chave.
    paths:
      include:
        - "apps/sisub/src/routes/_protected/_modules/diner/**"
        - "apps/sisub/src/routes/_protected/_modules/messhall/**"
        - "apps/sisub/src/routes/_protected/_modules/local-analytics/**"
        - "apps/sisub/src/routes/_public/tutorial.tsx"
        - "apps/sisub/src/components/features/diner/**"
        - "apps/sisub/src/components/features/messhall/**"
        - "apps/sisub/src/components/features/analytics/**"
        - "apps/sisub/src/components/features/analytics-chat/**"
        - "apps/sisub/src/components/features/local/PresenceTable.tsx"
    patterns:
      - pattern-regex: (?i)\bprevis(?:ão|ões|to|tos|ta|tas)\b
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*|\{/\*).*$
      # A estimativa agregada e a previsão de demanda são "previsão" de fato.
      - pattern-not-regex: (?i)previs(?:ão|ões) de (?:demanda|comensais)|efetivo previst[oa]s?|comensais previstos
      - pattern-not-regex: \bkeywords:\s*\[[^\]]*\]


  # ── Lote 8a: "rancho" ──────────────────────────────────────────────────────
  #
  # "Rancho" nomeia três coisas conforme a frase ("rancho dos oficiais" é um refeitório; "rancho
  # da DIRAD" é a unidade com as suas cozinhas e refeitórios), então não é linguagem ubíqua (D1,
  # critério 6; D10). Ficam de fora:
  #   - o nome próprio da função, "Fiscal de rancho" (rótulo do módulo `messhall`);
  #   - as palavras-chave de busca (`keywords: [...]`), para quem procura pelo termo antigo;
  #   - a MENÇÃO à palavra entre aspas tipográficas (“rancho”): o prompt e o glossário dos agentes
  #     explicam o termo que o usuário digita, sem usá-lo;
  #   - a citação do título da norma do lanche (`stops: "Recomendações — …"` em `NORM_REFS`);
  #   - `PIRANCHO`, valor de PI do SIAFI em fixture (nome de terceiro, D3);
  #   - o efetivo (`kitchen.rancho`, `rancho_id` e os identificadores do roster), que é o lote 8b:
  #     os arquivos só dele saem por caminho, e o que vaza para barril, registro e guard sai pela
  #     última exclusão. O lote 8b apaga as duas.
  # A API entrou nos caminhos com o lote 7; fica de fora só o alias depreciado do arranchamento
  # (`LEGACY_ARRANCHAMENTO_PATH`), até o mantenedor retirá-lo. Os docs têm regra própria
  # em `ubiquitous-language-docs.yaml`, sem a exclusão de linha de comentário (em Markdown, `*`
  # abre lista e `**`, negrito).

  - id: ubiquitous-language-lot8a-rancho
    languages: [generic]
    severity: ERROR
    message: >-
      "Rancho" é ambíguo e não é termo do sisub: use cozinha (`kitchen`, onde se produz),
      refeitório (`mess_hall`, onde o comensal come e a presença é registrada) ou unidade (`unit`,
      a OM e a sua subsistência), conforme o que a frase quer dizer; "chefe do rancho" é quem tem
      Gestão Unidade. A única exceção é o nome da função "Fiscal de rancho", rótulo do módulo de
      presença; nas palavras-chave de busca a palavra pode ficar.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
        - "packages/pbac/src/**/*.ts"
        - "apps/docs/src/**/*.tsx"
        - "apps/api/src/**/*.ts"
      exclude:
        - "**/routeTree.gen.ts"
        # Efetivo (`kitchen.rancho`): lote 8b.
        - "apps/sisub/src/components/features/workforce/**"
        - "apps/sisub/src/routes/**/workforce.tsx"
        - "apps/sisub/src/server/workforce.fn.ts"
        - "packages/sisub-domain/src/operations/workforce*.ts"
        - "packages/sisub-domain/src/utils/workforce-metrics*.ts"
        - "packages/sisub-domain/src/schemas/workforce.ts"
    patterns:
      - pattern-regex: (?i)\w*rancho\w*
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      - pattern-not-regex: \bFisca(?:l|is) de rancho\b
      - pattern-not-regex: \bkeywords:\s*\[[^\]]*\]
      - pattern-not-regex: “rancho”
      - pattern-not-regex: \bstops:\s*"Recomendações — [^"]*"
      - pattern-not-regex: \bPIRANCHO\b
      # Alias depreciado da API do arranchamento (lote 7), até o mantenedor retirá-lo.
      - pattern-not-regex: \bLEGACY_ARRANCHAMENTO_PATH\s*=\s*"/rancho_previsoes"
      # Efetivo, até o lote 8b.
      - pattern-not-regex: \bkitchen\.rancho\b|\brancho_id\b|\b(?:[cC]reate|[uU]pdate)Rancho(?:Fn|Schema)?\b|\bWorkforceRanchoWire\b|\bRanchoWorkforce\w*|\bcomputeRanchoMetrics\b|Efetivo dos Ranchos

  # ── Lote 5: valores de domínio ─────────────────────────────────────────────
  #
  # O cardápio de apoio (`template_type = 'apoio'`) nunca foi exceção: são refeições previsíveis
  # fora da rotina semanal. Rota e identificador saíram no expand (20260927100000); o VALOR antigo
  # (`'exception'`, os papéis em inglês da designação, os tipos de inventário e `product`) saiu com
  # o contract 20260927110000. `exceptionReason` (motivo da exceção na aprovação do inventário) é
  # outro conceito e não casa.

  - id: ubiquitous-language-lot5-identifier
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub: o cardápio de apoio é `apoio`
      (`supportMenuSelections`, `supportMenuId`, `isSupportMenu`, `SupportMenu*`,
      `SNACK_STANDARD_NOT_SUPPORT_MENU`), não "exceção" (`exceptionSelections`, `exceptionId`,
      `isException`, `Exception*Page`). Homônimo: `snack_family = 'apoio'` é o lanche de apoio.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
      exclude:
        - "**/routeTree.gen.ts"
    patterns:
      - pattern-regex: \b(?:exceptionSelections|exceptionSels|exceptionIds?|isException(?:Bucket)?|\w*Exceptions?Page|\w*ExceptionEditor\w*|SNACK_STANDARD_NOT_EXCEPTION|OCCASION_MENU_COPY\.exception|exceptions_without_occurrences|exceptionsWithoutOccurrences)\b
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$

  - id: ubiquitous-language-lot5-route
    languages: [generic]
    severity: ERROR
    message: >-
      Rota com segmento descartado pelo glossário do sisub: o cardápio de apoio mora em
      `global/support-menus` e `kitchen/$kitchenId/support-menus`, não em `*/exceptions`. O caminho
      antigo só existe como entrada `from` de `LEGACY_ROUTE_PREFIXES`
      (`apps/sisub/src/lib/legacy-routes.ts`), por um ciclo de deploy.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
      exclude:
        - "**/routeTree.gen.ts"
    patterns:
      - pattern-regex: /exceptions(?=[/"'`?#)]|$)
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      - pattern-not-regex: \bfrom:\s*["'`][^"'`]*["'`]

  - id: ubiquitous-language-lot5-value
    languages: [generic]
    severity: ERROR
    message: >-
      Valor de domínio descartado pelo glossário do sisub (contract 20260927110000). Papel na
      designação: `gestor`, `fiscal_tecnico`, `fiscal_administrativo`, `fiscal_setorial`,
      `membro_comissao` (Lei 14.133/2021, arts. 7º, 117 e 140, II, b). Tipo de inventário:
      `anual`, `transferencia_responsabilidade`, `eventual`, `rotativo`. Alvo da regra de política:
      `ingredient` (não `product`). Cardápio de apoio: `apoio` (não `exception`).
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
        - "apps/api/src/**/*.ts"
      exclude:
        - "**/routeTree.gen.ts"
        - "**/generated.ts"
        - "**/drizzle/**"
    patterns:
      - pattern-either:
          # Os papéis e o tipo de inventário antigos são inconfundíveis: qualquer literal casa.
          - pattern-regex: |-
              ["'`](?:technical_inspector|administrative_inspector|sectoral_inspector|committee_member|responsibility_transfer)["'`]
          # Os genéricos só na mesma linha da coluna, do campo ou do tipo deles.
          - pattern-regex: (?i)\b(?:template_?type|origin_?template_?type|TemplateType)\b[^\n]*["'`]exception["'`]
          - pattern-regex: \btarget\b[^\n]*["'`]product["'`]|["'`]product["'`][^\n]*\bPolicyTarget\b
          - pattern-regex: \brole\b[^\n]*["'`]manager["'`]|["'`]manager["'`][^\n]*\bDesignationRole\b
          - pattern-regex: \b(?:type|InventoryCountType)\b[^\n]*["'`](?:annual|rotating)["'`]
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
