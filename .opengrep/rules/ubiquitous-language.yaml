##
# Linguagem ubíqua do sisub (change `sisub-ubiquitous-language`, D8): o nome descartado de um lote
# concluído não volta. Cada regra aponta o nome do glossário
# (`openspec/changes/sisub-ubiquitous-language/specs/ubiquitous-language/spec.md`).
#
# A lista cresce por lote. Termo ainda em uso não entra, senão o gate nasce vermelho: a pesquisa de
# preços e os prefixos entram no lote 3, `product` (valor de `policy_rule.target`) no lote 5,
# "rancho" no lote 8. As migrations novas têm regra própria em `ubiquitous-language-sql.yaml`.
#
# Linha de comentário não é acusada (`pattern-not-regex` da linha inteira): comentário cita o nome
# antigo para contar a história do rename. Os casos de teste de cada regra estão em
# `__fixtures__/ubiquitous-language.ts` (`opengrep test`, comando no cabeçalho de lá).
#
# Regras compatíveis com Opengrep e Semgrep (mesma sintaxe).
##
rules:
  - id: ubiquitous-language-lot1-identifier
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub. Previsão de demanda é `demand_forecast`
      (`DemandForecast`, `demandForecast*`, `forecastId`, arquivos `demand-forecast*`), não
      `KitchenAtaDraft`/`kitchenDraft`/`kitchen-draft`. Liquidação e pagamento são `liquidacao` e
      `pagamento` (Lei 4.320, arts. 62-65; `liquidation` é falso cognato e `pagamento` fica com
      `empenho` e `liquidacao`); o recolhimento da retenção é `remittance`. A preparação herdada do
      SISUBWEB é `legacy_preparation` (tool `list_legacy_preparations`).
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
        - "apps/api/src/**/*.ts"
        - "packages/database/src/sisub.ts"
      exclude:
        - "**/routeTree.gen.ts"
        - "**/generated.ts"
        - "**/drizzle/**"
    patterns:
      - pattern-regex: \b(?:\w*KitchenAtaDraft\w*|\w*[kK]itchenDrafts?\w*|kitchen-draft|kitchen_ata_draft|\w*[lL]iquidations?\w*|\w*[pP]ayments?\w*|list_preparations|\w*[aA]gentListPreparations\w*)
      # Linha de comentário conta a história do rename.
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      # O registro de auditoria guarda o nome com que a linha foi gravada: o alias de leitura
      # (`RENAMED_OPERATIONS` em `assurance-registry.ts`) precisa citar o nome antigo.
      - pattern-not-regex: registerDeductionPaymentFn:\s*"registerDeductionRemittanceFn"
      # O mapa de caminhos antigos (`lib/legacy-routes.ts`) e quem o testa citam a origem como
      # `from: "<caminho antigo>"`: é o único lugar em que o nome descartado é o dado.
      - pattern-not-regex: \bfrom:\s*["'`][^"'`]*["'`]

  - id: ubiquitous-language-lot1-route
    languages: [generic]
    severity: ERROR
    message: >-
      Rota com segmento descartado pelo glossário do sisub: `suprimentos` é `demand-forecasts`,
      `weekly-plans` é `weekly-menus`, `liquidations` é `liquidacoes`, `payments` é `pagamentos`.
      O caminho antigo só existe como entrada `from` de `LEGACY_ROUTE_PREFIXES`
      (`apps/sisub/src/lib/legacy-routes.ts`), por um ciclo de deploy; link, navegação e rota nova
      usam o nome do glossário.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
      exclude:
        - "**/routeTree.gen.ts"
    patterns:
      - pattern-regex: /(?:suprimentos|weekly-plans|liquidations|payments)(?=[/"'`?#)]|$)
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      # Origem do mapa de caminhos antigos (`lib/legacy-routes.ts`) e de quem o testa: a única
      # exceção, e por conteúdo, não por caminho de arquivo.
      - pattern-not-regex: \bfrom:\s*["'`][^"'`]*["'`]

  - id: ubiquitous-language-lot1-label
    languages: [generic]
    severity: ERROR
    message: >-
      Rótulo descartado pelo glossário do sisub. Use "Cardápio(s) Semanal(is)" (não "Plano(s)
      Semanal(is)"), "Cardápios de Apoio" (não "Apoios"), "Inventário Físico" (não "Contagem
      Física"), "Pesquisa de preços" (no plural, IN SEGES/ME 65/2021), "ARP (preço registrado)" (não
      "ATA (preço homologado)": só a ARP é ata, Lei 14.133, art. 6º, XLVI), "Fiscal de rancho" para
      o módulo de presença (nunca "Fiscal" sozinho: fiscal é o do contrato, art. 117) e "quem tem
      Gestão Unidade" no lugar de "chefe do rancho".
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
      exclude:
        - "**/routeTree.gen.ts"
    patterns:
      - pattern-regex: (?:Planos? Semana(?:l|is)|["'>`]\s*Apoios\s*["'<`]|na tela, \\?"Apoio\\?"|Contagem Física|ATA \(preço homologado\)|Pesquisa de [Pp]reço\b(?!s)|Fiscal de Rancho|chefe do rancho|(?:messhall|name):\s*"Fiscal")
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$

  # ── Lote 2: anexo quantitativo ─────────────────────────────────────────────
  #
  # Na lei só a Ata de Registro de Preços é ata (Lei 14.133, art. 6º, XLVI); o anexo quantitativo
  # do TR é a estimativa das quantidades (art. 18, § 1º, IV). Ficam de fora o que é a ARP de fato:
  # o espelho do Compras.gov.br (`numeroAta`, `numeroAtaRegistroPreco`, `anoAta`, `statusAta`,
  # `numero_ata`, `ano_ata`, `status_ata`, `descricaoAta`) e os VALORES `'ata'` de
  # `acquisition.instrument` e de `opening_balance.cost_source`.

  - id: ubiquitous-language-lot2-identifier
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub: o anexo quantitativo é `quantity_estimate`
      (`QuantityEstimate*`, `quantityEstimateId`, `quantity_estimate_item_id`, arquivos
      `quantity-estimate*`), estimativa das quantidades da Lei 14.133, art. 18, § 1º, IV; ata é só
      a ARP (art. 6º, XLVI). Tabelas `procurement.quantity_estimate*`, não `procurement_list*`;
      `quantity_estimate_id`/`quantity_estimate_kitchen_id`, não `list_id`/`list_kitchen_id`.
      Acréscimo da quantidade máxima é `max_increase_percent` (margem é a de preferência, art. 26),
      a justificativa é `max_quantity_justification` e a quantidade estimada é
      `estimated_quantity`. Tools: `list_quantity_estimates`, `get_quantity_estimate`,
      `update_quantity_estimate_status`.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "packages/sisub-domain/src/**/*.ts"
        - "apps/sisub-mcp/src/**/*.ts"
        - "apps/api/src/**/*.ts"
        - "packages/database/src/sisub.ts"
      exclude:
        - "**/routeTree.gen.ts"
        - "**/generated.ts"
        - "**/drizzle/**"
        # Lê a migration histórica que criou a coluna com o nome da época.
        - "packages/sisub-domain/src/operations/quantity-estimate-limits.sql-contract.test.ts"
    patterns:
      - pattern-either:
          # Compostos: nunca aparecem em prosa.
          - pattern-regex: \b(?:\w*[a-z0-9]Atas?(?=[A-Z0-9_]|\b)\w*|Atas?[A-Z]\w*|atas?[A-Z_]\w*|ATA_\w+|\w*[pP]rocurementList\w*|procurement_list\w*|list_id|listIds?|list_kitchen_id|listKitchenIds?|max_margin_percent|\w*[mM]axMargin\w*|\w*MarginPercent\w*|MARGIN_PERCENT|margin_justification|\w*[mM]arginJustification\w*|margin_tight|margin_requires_justification|total_quantity|totalQuantity|list_atas|get_atas|get_ata_details|update_ata_status)\b
          # `ata`/`atas` sozinho só onde é identificador: declaração, acesso a membro, argumento,
          # desestruturação ou chave de objeto com valor que não é texto.
          - pattern-regex: \b(?:const|let|var|function)\s+atas?\b|\batas?(?:\?\.|\.)[A-Za-z_$]|\(\s*atas?\s*[,)]|\{\s*atas?\s*[,}]|\batas?\s*:\s*[A-Za-z_$({\[]
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      # Espelho do Compras.gov.br e do banco da ARP.
      - pattern-not-regex: \b(?:numero|ano|status|descricao|formatNumero|anoFromNumero)Ata\w*|\bnumero_ata\b|\bano_ata\b|\bstatus_ata\b|Atalho
      # O mapa de caminhos antigos (`lib/legacy-routes.ts`) e quem o testa citam a origem como
      # `from: "<caminho antigo>"`: é o único lugar em que o nome descartado é o dado.
      - pattern-not-regex: \bfrom:\s*["'`][^"'`]*["'`]

  - id: ubiquitous-language-lot2-route
    languages: [generic]
    severity: ERROR
    message: >-
      Rota com segmento descartado pelo glossário do sisub: o anexo quantitativo mora em
      `unit/$unitId/quantity-estimates` (`/new`, `/$quantityEstimateId`,
      `/print/calculation-memory/$quantityEstimateId`, `/print/price-research/$quantityEstimateId`),
      não em `procurement`; na API admin, `/quantity-estimates/:quantityEstimateId`, não
      `/ata/:ataId`. O redirect e o alias depreciados do caminho antigo já cumpriram o ciclo e
      saíram com o contract 20260927050000.
    paths:
      include:
        - "apps/sisub/src/**/*.ts"
        - "apps/sisub/src/**/*.tsx"
        - "apps/sisub/e2e/**/*.ts"
        - "apps/api/src/**/*.ts"
      exclude:
        - "**/routeTree.gen.ts"
    patterns:
      - pattern-either:
          - pattern-regex: /unit(?:/[^/"'`\s]+)?/procurement(?=[/"'`?#)]|$)
          - pattern-regex: (?:\}|\$\{[^}]*\})/procurement(?=[/"'`?#)]|\$\{)
          - pattern-regex: (?:["'`])/procurement/
          - pattern-regex: /print/quantities(?=[/"'`?#)]|$)
          - pattern-regex: /ata/:\w+|/ata(?=["'`])
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      - pattern-not-regex: \bfrom:\s*["'`][^"'`]*["'`]

  - id: ubiquitous-language-lot2-label
    languages: [generic]
    severity: ERROR
    message: >-
      Rótulo descartado do anexo quantitativo. O anexo é CONCLUÍDO, não "publicado" (publicar é
      divulgar no PNCP, Lei 14.133, art. 54); a folga da quantidade máxima é "acréscimo sobre a
      estimada", não "margem" (margem é a de preferência, art. 26); a base é a "quantidade
      estimada", não o "alvo" ("Qtd Alvo"); e o anexo não é "ata" nem "lista".
    paths:
      include:
        - "apps/sisub/src/components/features/local/quantity-estimate/**"
        - "apps/sisub/src/components/features/local/procurement/**"
        - "apps/sisub/src/routes/_protected/_modules/unit/$unitId/quantity-estimates/**"
        - "apps/sisub/src/routes/_protected/_modules/unit/$unitId/quantity-estimates.tsx"
        - "apps/sisub/src/lib/quantity-estimate-annex.ts"
        - "apps/sisub/src/lib/quantity-estimate-utils.ts"
        - "apps/sisub/src/lib/annex-table.ts"
        - "apps/sisub/src/hooks/data/useQuantityEstimate.ts"
        - "packages/sisub-domain/src/operations/quantity-estimate.ts"
        - "packages/sisub-domain/src/operations/quantity-estimate-limits.ts"
    patterns:
      - pattern-regex: (?i)\bmargem\b|\bpublicad[oa]s?\b|\bpublicar\b|\bpublicação\b|Qtd\.?\s+Alvo|\balvo\s+planejado\b|"published"|\bpublished\s*[:]
      - pattern-not-regex: (?m)^\s*(?://|/\*|\*).*$
      # Publicar é, de fato, divulgar no PNCP; margem de preferência é a do art. 26.
      - pattern-not-regex: (?im)^.*(?:PNCP|licitação publicada|edital|preferência).*$
