##
# Client Supabase com a secret key (service_role) montado à mão, fora do `@iefa/supabase-kit`.
#
# Nasceu de um bug que já aconteceu (#625): os dois streams de chat do sisub
# (`routes/api/analytics/stream.post.ts` e `routes/api/module-chat/stream.post.ts`) montavam o
# próprio `createServerClient(url, SISUB_SUPABASE_SECRET_KEY, { cookies })` para o `getUser()` e um
# `createClient(url, SISUB_SUPABASE_SECRET_KEY)` para os dados. Dois defeitos de uma vez:
#
#   - sem os deadlines de fetch do kit, uma consulta presa segurava a requisição até o ALB
#     derrubá-la com 502, sem erro nenhum no app;
#   - o client de auth com a service key é o mesmo defeito de `auth-client-secret-key`: qualquer
#     query feita por engano através dele roda como service_role e passa por cima da RLS.
#
# O portal tinha o mesmo padrão em `favorites.fn.ts` e `journal/email.server.ts` (#628).
# `createBrowserClient` com a secret é o pior caso: a chave vai para o bundle do navegador.
#
# Caminho certo: `createServiceRoleClient` do kit para dados (os getters de cada app, como
# `getKitchenClient` no sisub) e `createSsrAuthClient`/`createCookieAuthClient` com a publishable
# key para a sessão (`requireSisubUser` nas rotas Nitro do sisub).
#
# Fora do escopo, e por quê:
#   - `packages/supabase-kit/**`: é onde o client é montado de propósito.
#   - `apps/alpha/**`, `apps/api/**`: serviços Hono que ainda montam `createClient` direto. Dívida
#     declarada no AGENTS.md, não padrão; sai daqui quando migrarem para o kit.
#   - `apps/sisub-mcp/**`: o mantenedor decidiu migrar o `getDataClient` para o kit em PR
#     separado. Remover esta exclusão quando o PR de migração do sisub-mcp entrar.
#   - testes, e2e, helpers de teste (`src/test/**`) e `scripts/**`: montam o client de seed ou de
#     limpeza contra o banco, fora de requisição (sem ALB, sem sessão de usuário).
#
# O que a regra enxerga:
#   - as três fábricas (`createClient` do supabase-js, `createServerClient` e
#     `createBrowserClient` do `@supabase/ssr`) pelo import: nome direto, renomeado
#     (`import { createClient as c }`) ou por namespace (`import * as sb` + `sb.createClient`). O
#     import é o que ancora: o `createClient` do Sanity e o do openapi-fetch têm o mesmo nome e
#     outra assinatura.
#   - a chave SÓ PELO NOME do argumento: `envServer.SISUB_SUPABASE_SECRET_KEY`,
#     `requireEnv("…_SECRET_KEY")`, `process.env.API_SUPABASE_SERVICE_ROLE_KEY`, `serviceRoleKey`,
#     `secret`. Uma variável com nome neutro (`const k = envServer.SISUB_SUPABASE_SECRET_KEY` e
#     `createClient(url, k)`) passa: a regra não segue valor. É limite conhecido, não garantia.
#
# Casos de teste: `__fixtures__/supabase-client-outside-kit.ts` (opengrep test --config
# .opengrep/rules/supabase-client-outside-kit.yaml .opengrep/rules/__fixtures__/supabase-client-outside-kit.ts).
#
# Regras compatíveis com Opengrep e Semgrep (mesma sintaxe).
##
rules:
  - id: supabase-secret-client-outside-kit
    languages: [typescript]
    severity: ERROR
    message: >-
      Client Supabase montado à mão com a secret key (service_role). Fora do `@iefa/supabase-kit`
      ele não tem os deadlines de fetch (consulta presa vira 502 no ALB); se for o client de
      sessão, uma query feita por engano através dele roda como service_role e passa por cima da
      RLS; no navegador (`createBrowserClient`), a chave vaza no bundle. Dados:
      `createServiceRoleClient` (ou o getter do app, como `getKitchenClient`). Sessão:
      `createSsrAuthClient`/`createCookieAuthClient`/`resolveCookieSessionUser` com a publishable
      key (no sisub, `requireSisubUser` nas rotas Nitro). Navegador: `createAppBrowserClient`.
    paths:
      include:
        - "apps/**"
      exclude:
        - "apps/alpha/**"
        - "apps/api/**"
        # Remover quando o PR de migração do sisub-mcp para o kit entrar.
        - "apps/sisub-mcp/**"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/e2e/**"
        - "**/src/test/**"
        - "**/scripts/**"
    patterns:
      - pattern-either:
          # Nome direto.
          - patterns:
              - pattern-inside: |
                  import { createClient } from "@supabase/supabase-js"
                  ...
              - pattern: createClient($URL, $K, ...)
          - patterns:
              - pattern-inside: |
                  import { createServerClient } from "@supabase/ssr"
                  ...
              - pattern: createServerClient($URL, $K, ...)
          - patterns:
              - pattern-inside: |
                  import { createBrowserClient } from "@supabase/ssr"
                  ...
              - pattern: createBrowserClient($URL, $K, ...)
          # Import renomeado: `import { createClient as createSupabaseClient }`.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      import { $FN as $ALIAS } from "@supabase/supabase-js"
                      ...
                  - pattern-inside: |
                      import { $FN as $ALIAS } from "@supabase/ssr"
                      ...
              - metavariable-regex:
                  metavariable: $FN
                  regex: '^(createClient|createServerClient|createBrowserClient)$'
              - pattern: $ALIAS($URL, $K, ...)
          # Namespace: `import * as sb` + `sb.createClient(…)`.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      import * as $NS from "@supabase/supabase-js"
                      ...
                  - pattern-inside: |
                      import * as $NS from "@supabase/ssr"
                      ...
              - pattern-either:
                  - pattern: $NS.createClient($URL, $K, ...)
                  - pattern: $NS.createServerClient($URL, $K, ...)
                  - pattern: $NS.createBrowserClient($URL, $K, ...)
      - metavariable-regex:
          metavariable: $K
          regex: '(?i).*(secret|service_?role)'
