##
# Leitura PostgREST com `.limit(N)` acima do teto de 1000 linhas.
#
# Nasceu de um bug que já aconteceu (#626): o PostgREST devolve no máximo `max_rows` linhas por
# requisição (1000, o padrão, que o projeto não altera) e NÃO avisa quando corta. `.limit(2000)`
# parece pedir 2000 e volta 1000, com status 200 e sem erro:
#
#   - `budget.fn.ts` lia empenhos, `v_empenho_vigente` e notas de crédito com `.limit(2000)`. A
#     view nem tinha ordem, então o corte era aleatório: empenho fora dele entrava com valor
#     vigente 0 e inflava o saldo projetado;
#   - `acquisition.fn.ts` lia as classes CATMAT com `.limit(2000)`;
#   - na api, o `defaultLimit`/`maxLimit = 100000` do factory prometia o que não entregava:
#     `/arranchamentos` (~44 mil linhas) respondia 200 com exatamente 1000.
#
# Caminho certo: `readAllPages` (`apps/sisub/src/lib/read-all-pages.ts`), que pagina com
# `.range(from, to)` sobre uma ordem por chave única até a página vazia; na api, `readUpTo`
# (`apps/api/src/api/read-up-to.ts`), que pagina até o `limit` pedido.
#
# A regra só olha cadeia PostgREST (`.from(…).select(…)` ou `.rpc(…)`): no Drizzle a ordem é
# `db.select().from(t)` e não há teto, então `.limit(5000)` ali não casa. Limite em variável
# (`.limit(input.limit)`) também não casa: o literal é o caso que dá para afirmar sem seguir valor.
# Escopo de `apps/**` e `packages/**`: o teto é do PostgREST, não de um app.
#
# Casos de teste: `__fixtures__/postgrest-row-cap.ts` (opengrep test --config
# .opengrep/rules/postgrest-row-cap.yaml .opengrep/rules/__fixtures__/postgrest-row-cap.ts).
#
# Regras compatíveis com Opengrep e Semgrep (mesma sintaxe).
##
rules:
  - id: postgrest-limit-above-row-cap
    languages: [typescript]
    severity: ERROR
    message: >-
      `.limit(N)` com N > 1000 numa leitura PostgREST. O PostgREST corta calado em 1000 linhas
      (`max_rows`): a resposta vem com status 200, sem erro, e menor do que o pedido, e quem soma,
      conta ou decide a partir dela erra sem saber. Pagine com `readAllPages`
      (`apps/sisub/src/lib/read-all-pages.ts`, ordem por chave única) ou, na api, `readUpTo`.
    paths:
      include:
        - "apps/**"
        - "packages/**"
      exclude:
        - "**/*.test.ts"
    patterns:
      - pattern: $Q.limit($N)
      - metavariable-pattern:
          metavariable: $Q
          pattern-either:
            - pattern: $C.from(...).select(...)
            - pattern: $C.rpc(...)
      - metavariable-comparison:
          metavariable: $N
          comparison: $N > 1000
