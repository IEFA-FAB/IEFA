##
# Linguagem ubíqua do sisub no banco (change `sisub-ubiquitous-language`, D8): migration NOVA não
# cria, não renomeia para e não comenta objeto com nome descartado pelo glossário
# (`openspec/changes/sisub-ubiquitous-language/specs/ubiquitous-language/spec.md`).
#
# `drop` não é acusado: o contract precisa citar o nome antigo para derrubá-lo. Vale só para as
# migrations depois de 20260927050000 (contract do lote 2): as anteriores estão aplicadas e são o
# histórico, e o expand/contract do lote 2 citam os nomes antigos de propósito (views de
# compatibilidade e colunas espelhadas). A lista de termos cresce por lote, como a de
# `ubiquitous-language.yaml`; cada lote tem a sua regra, com a exclusão até o próprio contract (a
# do lote 3, pesquisa de preços e prefixos, vai até 20260927070000; a do lote 4, finanças, até
# 20260927090000; a do lote 5, valores de domínio, até 20260927110000; a do lote 7, arranchamento,
# exclui só o expand e o contract dele; a do lote 8b, o efetivo por refeitório, até 20260927160000).
#
# Casos de teste: `__fixtures__/ubiquitous-language-sql.sql` (opengrep test --config
# .opengrep/rules/ubiquitous-language-sql.yaml .opengrep/rules/__fixtures__/ubiquitous-language-sql.sql).
#
# Regras compatíveis com Opengrep e Semgrep (mesma sintaxe).
##
rules:
  - id: ubiquitous-language-migration-lot2
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub numa migration nova. O anexo quantitativo é
      `procurement.quantity_estimate*` (Lei 14.133, art. 18, § 1º, IV; ata é só a ARP, art. 6º,
      XLVI), com `quantity_estimate_id` / `quantity_estimate_item_id` /
      `quantity_estimate_kitchen_id`, não `procurement_list*`, `list_id`, `list_kitchen_id`,
      `ata_id` ou `ata_item_id`. O acréscimo da quantidade máxima é `max_increase_percent` (margem
      é a de preferência, art. 26), a justificativa é `max_quantity_justification` e a quantidade
      estimada é `estimated_quantity`.
    paths:
      include:
        - "packages/database/supabase/migrations/*.sql"
      exclude:
        # Tudo até 20260927050000 inclusive (aplicado, ou expand/contract do lote 2).
        - "packages/database/supabase/migrations/2024*"
        - "packages/database/supabase/migrations/2025*"
        - "packages/database/supabase/migrations/20260[1-8]*"
        - "packages/database/supabase/migrations/202609[0-1]*"
        - "packages/database/supabase/migrations/2026092[0-6]*"
        # 2026-09-27 até 04:59:59 (o timestamp é AAAAMMDDhhmmss) e o próprio contract.
        - "packages/database/supabase/migrations/202609270[0-4]*"
        - "packages/database/supabase/migrations/20260927050000_*"
    patterns:
      - pattern-either:
          - patterns:
              # Do verbo que cria ou nomeia até o `;` que fecha o statement. Linha de comentário conta a
              # história do rename e não é acusada.
              - pattern-regex: >-
                  (?is)\b(?:create\s+(?:or\s+replace\s+)?(?:table|view|materialized\s+view|(?:unique\s+)?index|function|trigger)|add\s+column|add\s+constraint|rename\s+(?:column\s+\w+\s+)?to|comment\s+on)\b[^;]*?\b(?:procurement_list\w*|list_id|list_kitchen_id|ata_id|ata_item_id|max_margin_percent|margin_justification|total_quantity)\b
              - pattern-not-regex: (?m)^\s*--.*$
          # Corpo entre dollar quotes (função, `do`): o `;` de dentro não fecha o statement, e é
          # o caso perigoso — plpgsql resolve tabela pelo nome e passaria por uma view de
          # compatibilidade, que não dispara os triggers da tabela. A abertura é a que vem depois
          # de `as`/`do`: sem isso o casamento começaria no `$$` que FECHA uma função e iria até o
          # que abre a seguinte, acusando o texto entre as duas (um `drop column`, por exemplo).
          # Sem a exclusão de comentário: `pattern-not-regex` descarta o achado inteiro que ela
          # toca, e um `-- comentário` qualquer no corpo esconderia a função.
          - pattern-regex: >-
              (?is)\b(?:as|do)\s+(\$[a-z_0-9]*\$)(?:(?!\1).)*?\b(?:procurement_list\w*|list_id|list_kitchen_id|ata_id|ata_item_id|max_margin_percent|margin_justification|total_quantity)\b(?:(?!\1).)*\1

  - id: ubiquitous-language-migration-lot3
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub numa migration nova. A pesquisa de preços é
      `procurement.price_research*` (Lei 14.133, art. 23; IN SEGES/ME 65/2021), não
      `procurement_pesquisa_preco*`/`pesquisa_preco`; a amostra coletada é `procurement.price_sample`
      (coluna `price_sample_id`, RPC `upsert_price_samples`, `sisub.price_sample_fingerprint`), não
      `compras_amostra`/`amostra_id`. Sem prefixo redundante: `procurement.arp*` e
      `procurement.segment*`, não `procurement_arp*`/`procurement_segment*`.
    paths:
      include:
        - "packages/database/supabase/migrations/*.sql"
      exclude:
        # Tudo até 20260927070000 inclusive (aplicado, ou expand/contract do lote 3, que citam os
        # nomes antigos de propósito: views e wrappers de compatibilidade).
        - "packages/database/supabase/migrations/2024*"
        - "packages/database/supabase/migrations/2025*"
        - "packages/database/supabase/migrations/20260[1-8]*"
        - "packages/database/supabase/migrations/202609[0-1]*"
        - "packages/database/supabase/migrations/2026092[0-6]*"
        # 2026-09-27 até 06:59:59 e o próprio contract.
        - "packages/database/supabase/migrations/202609270[0-6]*"
        - "packages/database/supabase/migrations/20260927070000_*"
    patterns:
      - pattern-either:
          - patterns:
              # Do verbo que cria ou nomeia até o `;` que fecha o statement. Linha de comentário conta a
              # história do rename e não é acusada.
              - pattern-regex: >-
                  (?is)\b(?:create\s+(?:or\s+replace\s+)?(?:table|view|materialized\s+view|(?:unique\s+)?index|function|trigger)|add\s+column|add\s+constraint|rename\s+(?:column\s+\w+\s+)?to|comment\s+on)\b[^;]*?\b(?:\w*pesquisa_preco\w*|\w*compras_amostras?\w*|amostra_id|\w*procurement_arp\w*|\w*procurement_segment\w*)\b
              - pattern-not-regex: (?m)^\s*--.*$
          # Corpo entre dollar quotes: ver a regra do lote 2 (abertura depois de `as`/`do`, sem a
          # exclusão de comentário).
          - pattern-regex: >-
              (?is)\b(?:as|do)\s+(\$[a-z_0-9]*\$)(?:(?!\1).)*?\b(?:\w*pesquisa_preco\w*|\w*compras_amostras?\w*|amostra_id|\w*procurement_arp\w*|\w*procurement_segment\w*)\b(?:(?!\1).)*\1

  - id: ubiquitous-language-migration-lot4
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub numa migration nova. Numa UG executora não há
      dotação (ela é da LOA, no órgão): o crédito que chega por NC é
      `finance.budget_credit.received_credit`, e o saldo do SIAFI é o crédito disponível,
      `available_credit_siafi`, não `dotacao`/`saldo_siafi`. A UG emitente da NE é
      `finance.empenho.issuer_ug`, como em `finance.credit_note`, não `ug_emitente`.
    paths:
      include:
        - "packages/database/supabase/migrations/*.sql"
      exclude:
        # Tudo antes do expand do lote 4 (aplicado ou de outro lote) e os dois arquivos do lote 4,
        # que citam os nomes antigos de propósito (espelho e conferência de divergência). Migration
        # nova entre os dois, ou depois, é acusada.
        - "packages/database/supabase/migrations/2024*"
        - "packages/database/supabase/migrations/2025*"
        - "packages/database/supabase/migrations/20260[1-8]*"
        - "packages/database/supabase/migrations/202609[0-1]*"
        - "packages/database/supabase/migrations/2026092[0-6]*"
        - "packages/database/supabase/migrations/202609270[0-7]*"
        - "packages/database/supabase/migrations/20260927080000_ubiquitous_language_lot4.sql"
        - "packages/database/supabase/migrations/20260927090000_ubiquitous_language_lot4_contract.sql"
    patterns:
      - pattern-either:
          - patterns:
              # Do verbo que cria ou nomeia até o `;` que fecha o statement. Linha de comentário conta a
              # história do rename e não é acusada.
              - pattern-regex: >-
                  (?is)\b(?:create\s+(?:or\s+replace\s+)?(?:table|view|materialized\s+view|(?:unique\s+)?index|function|trigger)|add\s+column|add\s+constraint|rename\s+(?:column\s+\w+\s+)?to|comment\s+on)\b[^;]*?\b(?:dotacao|saldo_siafi|ug_emitente)\b
              - pattern-not-regex: (?m)^\s*--.*$
          # Corpo entre dollar quotes: ver a regra do lote 2 (abertura depois de `as`/`do`, sem a
          # exclusão de comentário).
          - pattern-regex: >-
              (?is)\b(?:as|do)\s+(\$[a-z_0-9]*\$)(?:(?!\1).)*?\b(?:dotacao|saldo_siafi|ug_emitente)\b(?:(?!\1).)*\1

  - id: ubiquitous-language-migration-lot7
    languages: [generic]
    severity: ERROR
    message: >-
      Nome descartado pelo glossário do sisub numa migration nova. O comensal se arrancha: a tabela
      é `kitchen.arranchamento` (índices e constraints `arranchamento_*`), não `meal_forecasts`.
      "Forecast" fica para a estimativa agregada (`daily_menu.forecasted_headcount`).
    paths:
      include:
        - "packages/database/supabase/migrations/*.sql"
      exclude:
        # Tudo antes do expand do lote 7 (aplicado ou de outro lote) e os dois arquivos do lote 7,
        # que citam o nome antigo de propósito (view de compatibilidade e as conferências). Migration
        # nova entre os dois, ou depois, é acusada.
        - "packages/database/supabase/migrations/2024*"
        - "packages/database/supabase/migrations/2025*"
        - "packages/database/supabase/migrations/20260[1-8]*"
        - "packages/database/supabase/migrations/202609[0-1]*"
        - "packages/database/supabase/migrations/2026092[0-6]*"
        - "packages/database/supabase/migrations/202609270*"
        - "packages/database/supabase/migrations/2026092710*"
        - "packages/database/supabase/migrations/2026092711*"
        - "packages/database/supabase/migrations/2026092712*"
        - "packages/database/supabase/migrations/20260927130000_ubiquitous_language_lot7.sql"
        - "packages/database/supabase/migrations/20260927140000_ubiquitous_language_lot7_contract.sql"
    patterns:
      - pattern-either:
          - patterns:
              # Do verbo que cria ou nomeia até o `;` que fecha o statement. Linha de comentário conta a
              # história do rename e não é acusada.
              - pattern-regex: >-
                  (?is)\b(?:create\s+(?:or\s+replace\s+)?(?:table|view|materialized\s+view|(?:unique\s+)?index|function|trigger)|add\s+column|add\s+constraint|rename\s+(?:column\s+\w+\s+)?to|comment\s+on)\b[^;]*?\b\w*meal_forecasts?\w*\b
              - pattern-not-regex: (?m)^\s*--.*$
          # Corpo entre dollar quotes: ver a regra do lote 2 (abertura depois de `as`/`do`, sem a
          # exclusão de comentário).
          - pattern-regex: >-
              (?is)\b(?:as|do)\s+(\$[a-z_0-9]*\$)(?:(?!\1).)*?\b\w*meal_forecasts?\w*\b(?:(?!\1).)*\1

  # Lote 8a: "rancho" é ambíguo (refeitório, cozinha ou a unidade, D10) e não nomeia objeto novo
  # nem entra em comentário do banco. Ficam de fora o nome da função "Fiscal de rancho" e o próprio
  # efetivo (`kitchen.rancho`, `core.rancho`, `rancho_id`): as migrations de 2026-09-27 entre 10:00
  # e o contract do 8b (lotes 5 e 7 e o expand/contract do 8b, que citam os nomes antigos de
  # propósito) ficam só com esta regra. Depois do contract 20260927160000 vale a regra do lote 8b,
  # abaixo, sem a exclusão do efetivo. `update` de dado não é acusado (o lote 8a casa o texto
  # antigo no `where`), nem corpo de função, que cita tabela e não escreve texto de tela.
  - id: ubiquitous-language-migration-lot8a
    languages: [generic]
    severity: ERROR
    message: >-
      "Rancho" numa migration nova. O termo é ambíguo: use cozinha (`kitchen`), refeitório
      (`mess_hall`) ou unidade (`unit`) no nome do objeto e no comentário. A única exceção é o nome
      da função "Fiscal de rancho".
    paths:
      include:
        - "packages/database/supabase/migrations/*.sql"
      exclude:
        # Tudo antes de 2026-09-27 10:00 (aplicado ou de outro lote).
        - "packages/database/supabase/migrations/2024*"
        - "packages/database/supabase/migrations/2025*"
        - "packages/database/supabase/migrations/20260[1-8]*"
        - "packages/database/supabase/migrations/202609[0-1]*"
        - "packages/database/supabase/migrations/2026092[0-6]*"
        - "packages/database/supabase/migrations/202609270*"
    patterns:
      - pattern-regex: >-
          (?is)\b(?:create\s+(?:or\s+replace\s+)?(?:table|view|materialized\s+view|(?:unique\s+)?index|function|trigger)|add\s+column|add\s+constraint|rename\s+(?:column\s+\w+\s+)?to|comment\s+on)\b(?:[^;']|'(?:[^']|'')*')*?(?:'(?:[^']|'')*?)?(?:(?<!kitchen\.)(?<!core\.)(?-i:(?<!Fiscal de )(?<!Fiscais de ))rancho(?!_id\b)|(?-i:(?<=Fiscal de )R)ancho|(?-i:(?<=Fiscais de )R)ancho|(?<=kitchen\.)rancho\w|(?<=core\.)rancho\w)
      - pattern-not-regex: (?m)^\s*--.*$

  - id: ubiquitous-language-migration-lot5
    languages: [generic]
    severity: ERROR
    message: >-
      Valor de domínio descartado pelo glossário do sisub numa migration nova. Papel na designação:
      `gestor`, `fiscal_tecnico`, `fiscal_administrativo`, `fiscal_setorial`, `membro_comissao`
      (não `manager`, `technical_inspector`...). Tipo de inventário: `anual`,
      `transferencia_responsabilidade`, `eventual`, `rotativo`. Alvo da regra de política:
      `ingredient` (não `product`). Cardápio de apoio: `template_type = 'apoio'` (não `exception`).
    paths:
      include:
        - "packages/database/supabase/migrations/*.sql"
      exclude:
        # Tudo até o expand do lote 5 (aplicado ou de outro lote) e os dois arquivos do lote 5, que
        # citam os valores antigos de propósito (CHECK alargado, conversão e conferência). Migration
        # nova entre os dois, ou depois, é acusada.
        - "packages/database/supabase/migrations/2024*"
        - "packages/database/supabase/migrations/2025*"
        - "packages/database/supabase/migrations/20260[1-8]*"
        - "packages/database/supabase/migrations/202609[0-1]*"
        - "packages/database/supabase/migrations/2026092[0-6]*"
        - "packages/database/supabase/migrations/202609270*"
        - "packages/database/supabase/migrations/20260927100000_ubiquitous_language_lot5.sql"
        - "packages/database/supabase/migrations/20260927110000_ubiquitous_language_lot5_contract.sql"
    patterns:
      - pattern-either:
          # Os papéis e o tipo de inventário antigos são inconfundíveis: qualquer literal casa.
          - pattern-regex: '''(?:technical_inspector|administrative_inspector|sectoral_inspector|committee_member|responsibility_transfer)'''
          # Os genéricos só ao lado da coluna deles (comparação, lista, default ou atribuição).
          - pattern-regex: (?is)\b(?:role|type|target|template_type|origin_template_type)\b\s*(?:=|<>|!=|\bin\s*\(|=\s*any\s*\(\s*array\s*\[|(?:\bset\s+)?\bdefault\b)[^;]*?'(?:manager|annual|rotating|product|exception)'
      - pattern-not-regex: (?m)^\s*--.*$

  # Lote 8b: o efetivo por refeitório (`kitchen.rancho` → `kitchen.mess_hall_workforce`,
  # `workforce_submission.rancho_id` → `mess_hall_workforce_id`). Depois do contract não sobra
  # exceção de efetivo: nenhum objeto novo, comentário ou corpo de função cita "rancho", salvo o nome
  # da função "Fiscal de rancho" em texto. O corpo entre dollar quotes é acusado pelo NOME antigo
  # (`kitchen.rancho`, `core.rancho`, `rancho_id`): plpgsql resolve tabela pelo nome e a view de
  # compatibilidade já terá caído.
  - id: ubiquitous-language-migration-lot8b
    languages: [generic]
    severity: ERROR
    message: >-
      "Rancho" numa migration nova. O refeitório no levantamento de efetivo é
      `kitchen.mess_hall_workforce`, e a resposta aponta para ele por
      `workforce_submission.mess_hall_workforce_id`, não `kitchen.rancho`/`core.rancho`/`rancho_id`.
      Fora do efetivo, use cozinha (`kitchen`), refeitório (`mess_hall`) ou unidade (`unit`) no nome
      do objeto e no comentário. A única exceção é o nome da função "Fiscal de rancho".
    paths:
      include:
        - "packages/database/supabase/migrations/*.sql"
      exclude:
        # Tudo até o contract do lote 8b (20260927160000) inclusive: aplicado, de outro lote, ou o
        # expand/contract do 8b, que citam os nomes antigos de propósito (view de compatibilidade,
        # espelho e conferência de divergência).
        - "packages/database/supabase/migrations/2024*"
        - "packages/database/supabase/migrations/2025*"
        - "packages/database/supabase/migrations/20260[1-8]*"
        - "packages/database/supabase/migrations/202609[0-1]*"
        - "packages/database/supabase/migrations/2026092[0-6]*"
        - "packages/database/supabase/migrations/202609270*"
        - "packages/database/supabase/migrations/2026092710*"
        - "packages/database/supabase/migrations/2026092711*"
        - "packages/database/supabase/migrations/2026092712*"
        - "packages/database/supabase/migrations/2026092713*"
        - "packages/database/supabase/migrations/2026092714*"
        - "packages/database/supabase/migrations/2026092715*"
        - "packages/database/supabase/migrations/20260927160000_*"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-regex: >-
                  (?is)\b(?:create\s+(?:or\s+replace\s+)?(?:table|view|materialized\s+view|(?:unique\s+)?index|function|trigger)|add\s+column|add\s+constraint|rename\s+(?:column\s+\w+\s+)?to|comment\s+on)\b(?:[^;']|'(?:[^']|'')*')*?(?:'(?:[^']|'')*?)?(?:(?-i:(?<!Fiscal de )(?<!Fiscais de ))rancho|(?-i:(?<=Fiscal de )R)ancho|(?-i:(?<=Fiscais de )R)ancho)
              - pattern-not-regex: (?m)^\s*--.*$
          # Corpo entre dollar quotes: ver a regra do lote 2 (abertura depois de `as`/`do`, sem a
          # exclusão de comentário).
          - pattern-regex: >-
              (?is)\b(?:as|do)\s+(\$[a-z_0-9]*\$)(?:(?!\1).)*?\b(?:kitchen\.rancho|core\.rancho|rancho_id)\b(?:(?!\1).)*\1
