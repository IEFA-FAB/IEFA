              regex: ^["'`]user_permissions["'`]$
          - metavariable-regex:
              metavariable: $COLS
              regex: ^["'`]\s*(?:(?:(?:kitchen_id|mess_hall_id|module|unit_id|user_id)\s*,\s*){4}(?:kitchen_id|mess_hall_id|module|unit_id|user_id))\s*["'`]$
