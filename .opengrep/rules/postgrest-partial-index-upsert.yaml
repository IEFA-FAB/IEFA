##
# `upsert(..., { onConflict })` do PostgREST contra índice único PARCIAL.
#
# Nasceu de bug real (registrado no PR #500): a rota admin da pesquisa de preços do `api`
# gravava o cabeçalho com `upsert(..., { onConflict: "idempotency_key", ignoreDuplicates: true })`,
# mas o índice da chave é parcial (`uq_price_research_idempotency ... where idempotency_key is
# not null`). O PostgREST gera `ON CONFLICT (idempotency_key)` SEM o predicado, e o Postgres só
# aceita índice parcial como árbitro quando o `on conflict` repete o `where`: sem ele responde
# 42P10 ("there is no unique or exclusion constraint matching the ON CONFLICT specification").
# Não é falha do reenvio, é de TODA gravação — a memória de cálculo nunca foi gravada por ali.
# O mesmo defeito estava no `create_daily_menu` do chat do sisub (`daily_menu_active_unique`,
# `where deleted_at is null`). Reproduz sem escrever nada: `explain insert ... on conflict (...)
# do nothing` já dá 42P10.
#
# O PostgREST não tem como mandar o predicado. Caminhos certos:
#   - `insert` simples e, em 23505, reler a linha pela chave (`apps/api/src/workers/price-research/persist.ts`);
#   - a operation do domínio, que usa Drizzle com `where`/`targetWhere` no `onConflictDo*`
#     (`savePriceResearchAudit`, `upsertDailyMenu`);
#   - se a unicidade não precisa ser parcial, um índice TOTAL (migration).
#
# A lista abaixo é a dos índices únicos parciais sem expressão, sem índice total nas mesmas
# colunas, no banco compartilhado em 2026-09-27. Índice parcial novo entra aqui, e quem cobra é
# `apps/sisub/src/test/operations/partial-index-upsert-rule.contract.test.ts` (gate de
# integração): ele lê `pg_index` do banco vivo e reprova índice parcial sem bloco nesta regra.
# A consulta dele é a mesma que gerou a lista.
#
# A ordem das colunas no `onConflict` não importa para o Postgres, e o regex também não a exige.
# O que a regra NÃO vê: `onConflict` vindo de variável (`CARACTERISTICA_KEY.join(",")`) e
# `onConflictDo*` do Drizzle sem `where` (este tem tipo, não string, e o domínio já repete o
# predicado nos índices parciais que usa).
#
# Casos de teste: `__fixtures__/postgrest-partial-index-upsert.ts` (opengrep test --config
# .opengrep/rules/postgrest-partial-index-upsert.yaml .opengrep/rules/__fixtures__/postgrest-partial-index-upsert.ts).
##
rules:
  - id: postgrest-upsert-on-partial-unique-index
    languages: [typescript]
    # ERROR: a regra não acha nada no repo depois da correção, e o que ela acha falha 100% das
    # vezes em produção — não há caso legítimo a triar.
    severity: ERROR
    message: >-
      `upsert` com `onConflict` nas colunas de um índice único PARCIAL. O PostgREST gera
      `ON CONFLICT (cols)` sem o `where` do índice, e o Postgres responde 42P10 em toda gravação
      (não só no conflito). Use `insert` e trate o 23505 relendo a linha pela chave, ou a
      operation do domínio (Drizzle com `where` no `onConflictDo*`).
    # Todo o código dos alvos do scan, não só `src/`: script de seed e componente `.tsx` também
    # chamam o PostgREST.
    paths:
      include:
        - "apps/**/*.ts"
        - "apps/**/*.tsx"
        - "packages/**/*.ts"
      exclude:
        - "**/*.test.ts"
        - "**/*.test.tsx"
    # Um bloco por tabela: o par (tabela, colunas) tem de casar junto — tabela de um índice com
    # colunas de outro não é o defeito. A forma da chamada se repete em cada bloco porque
    # `metavariable-regex` só vale num `patterns` com termo positivo (e o Opengrep não resolve
    # âncora YAML).
    pattern-either:
      # access_control.policy
      - patterns:
          - pattern-either:
              - pattern: '$DB.from($T).upsert($ROWS, {..., onConflict: $COLS, ...})'
              - pattern: 'untypedFrom($CTX, $T, ...).upsert($ROWS, {..., onConflict: $COLS, ...})'
          - metavariable-regex:
              metavariable: $T
              regex: ^["'`]policy["'`]$
          - metavariable-regex:
              metavariable: $COLS
              regex: ^["'`]\s*(?:name)\s*["'`]$
      # access_control.signup_allowlist
