          - metavariable-regex:
              metavariable: $T
              regex: ^["'`]signup_allowlist["'`]$
          - metavariable-regex:
              metavariable: $COLS
              regex: ^["'`]\s*(?:email)\s*["'`]$
      # access_control.user_permissions
