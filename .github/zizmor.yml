# Política do zizmor para os workflows deste repo.
#
# `unpinned-uses`: a tag é aceita só para `actions/*` e `github/*`, que são do próprio
# GitHub e têm o mesmo modelo de confiança do runner que executa o job.
#
# Todo o resto precisa de SHA, inclusive `docker/*`, `aws-actions/*` e `oven-sh/*`: são
# orgs de fornecedor, não do GitHub, e rodam justamente nos jobs mais sensíveis (os que
# assumem a role de deploy via OIDC e fazem push no ECR). Uma tag é mutável: quem
# controla o repo da action reaponta a tag e passa a rodar código novo no nosso pipeline
# sem PR nenhum.
#
# O SHA leva a versão num comentário (`uses: x/y@<sha> # v1.2.3`). O Dependabot
# (ecossistema github-actions em dependabot.yml) atualiza os dois juntos, então o pin
# não vira ref opaca nem dívida parada.
rules:
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        github/*: ref-pin
        "*": hash-pin
