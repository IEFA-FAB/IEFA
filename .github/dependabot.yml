# Atualização automática de dependências.
#
# Escopo deliberadamente estreito: só ecossistemas onde uma versão desatualizada é risco
# de segurança, e agrupado para não gerar 20 PRs por semana (o volume é o que mata a
# adoção do Dependabot — PR ignorado é pior que PR inexistente).
#
# Alertas de vulnerabilidade (security updates) NÃO respeitam `schedule` nem os grupos:
# o Dependabot abre PR assim que o advisory sai, que é o comportamento desejado.
version: 2

updates:
  # ── JS/TS do monorepo ──────────────────────────────────────────────────────
  # `bun` como package-ecosystem lê o bun.lock e cobre todos os workspaces a partir da raiz.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # Espera antes de propor uma versão recém-publicada: a janela em que um pacote
    # comprometido é publicado, detectado e despublicado costuma ser de horas a dias.
    # Atualização de SEGURANÇA ignora o cooldown e vem na hora, que é o certo.
    cooldown:
      default-days: 7
    # Um PR por grupo e por semana no máximo; com dez grupos, o limite de 5 deixava família
    # sem PR na semana em que as outras também tinham versão nova.
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    # Sem `ignore` hoje: os três pins que existiam aqui (`vite` >=8.2, `@types/node`
    # >=26.1, `h3` >rc.22) eram todos o MESMO defeito — uma segunda cópia do pacote na
    # árvore, não a versão nova. Com o pin exato fora dos apps o bun resolve uma cópia
    # só e o typecheck passa. Antes de pinar de novo, confira quantas cópias o
    # bun.lock resolve; pin exato num app é o que CRIA a segunda quando uma
    # transitiva flutua (foi o vitest arrastando o próprio vite).

    # `xlsx` NÃO é rastreado por aqui e isso é de propósito: ele vem do tarball
    # oficial da SheetJS (cdn.sheetjs.com), não do registry. A SheetJS parou de
    # publicar no npm no 0.19 e o que ficou lá (0.18.5) carrega duas high sem
    # correção possível. O dependabot não abre PR para dependência por URL, então
    # subir de versão é MANUAL: conferir https://cdn.sheetjs.com/ e trocar a URL
    # nos package.json de apps/api e apps/sucont. A integridade sha512 do tarball
    # fica gravada no bun.lock (Bun 1.4), então a troca não passa despercebida.
    groups:
      # Um PR por família: subir React/TanStack/etc. peça por peça só cria conflito de peer.
      #
      # Cada dependência tem de casar com UM grupo só, por isso o `exclude-patterns` abaixo.
      # O Dependabot não resolve a sobreposição pela ordem: ele escolhe o grupo "mais
      # específico", e um grupo só de `update-types` ganha de um padrão com `*`. O log do
      # job de 2026-09-28 (run 36402570446) mostra `Skipping @tanstack/ai for group
      # 'tanstack' - belongs to more specific group 'minor-and-patch'`, e o mesmo com
      # `@supabase/*`, `@biomejs/*` e `@commitlint/*`: nenhum grupo com `@escopo/*` jamais
      # abriu PR. Foi assim que o #415 e o #522 subiram `@tanstack/ai` misturado com o resto
      # e quebraram as faixas de peer. Nome exato (`react`, `turbo`) casa normalmente.
      #
      # Família nova: grupo aqui em cima E os mesmos padrões no `exclude-patterns` do
      # `minor-and-patch`, senão ela volta a cair lá.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Core e adapters andam juntos: cada adapter declara peer `@tanstack/ai ^<minor>`.
      tanstack-ai:
        patterns: ["@tanstack/ai", "@tanstack/ai-*"]
      tanstack-router:
        patterns:
          - "@tanstack/react-router"
          - "@tanstack/react-router-*"
          - "@tanstack/react-start"
          - "@tanstack/react-start-*"
          - "@tanstack/router-*"
          - "@tanstack/start-*"
      tanstack:
        patterns: ["@tanstack/*"]
        exclude-patterns:
          - "@tanstack/ai"
          - "@tanstack/ai-*"
          - "@tanstack/react-router"
          - "@tanstack/react-router-*"
          - "@tanstack/react-start"
          - "@tanstack/react-start-*"
          - "@tanstack/router-*"
          - "@tanstack/start-*"
      aws-sdk:
        patterns: ["@aws-sdk/*", "@smithy/*"]
      langchain:
        patterns: ["@langchain/*", "langsmith"]
      # `nitro` fixa a faixa de `h3`; subir um sem o outro deixa duas cópias na árvore.
      nitro:
        patterns: ["nitro", "h3"]
      supabase:
        patterns: ["@supabase/*", "supabase", "drizzle-orm", "drizzle-kit", "postgres"]
      tooling:
        patterns: ["@biomejs/*", "turbo", "typescript", "vite", "vitest", "@vitejs/*", "knip", "husky", "commitizen", "cz-git", "@commitlint/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@tanstack/*"
          - "@aws-sdk/*"
          - "@smithy/*"
          - "@langchain/*"
          - "langsmith"
          - "nitro"
          - "h3"
          - "@supabase/*"
          - "supabase"
          - "drizzle-orm"
          - "drizzle-kit"
          - "postgres"
          - "@biomejs/*"
          - "turbo"
          - "typescript"
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "knip"
          - "husky"
          - "commitizen"
          - "cz-git"
          - "@commitlint/*"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  # Action comprometida = execução arbitrária num runner que assume role AWS via OIDC.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # Espera antes de propor uma versão recém-publicada: a janela em que um pacote
    # comprometido é publicado, detectado e despublicado costuma ser de horas a dias.
    # Atualização de SEGURANÇA ignora o cooldown e vem na hora, que é o certo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # ── Imagem base do Docker ──────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # Espera antes de propor uma versão recém-publicada: a janela em que um pacote
    # comprometido é publicado, detectado e despublicado costuma ser de horas a dias.
    # Atualização de SEGURANÇA ignora o cooldown e vem na hora, que é o certo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
