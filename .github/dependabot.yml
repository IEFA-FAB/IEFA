# Atualização automática de dependências.
#
# Escopo deliberadamente estreito: só ecossistemas onde uma versão desatualizada é risco
# de segurança, e agrupado para não gerar 20 PRs por semana (o volume é o que mata a
# adoção do Dependabot — PR ignorado é pior que PR inexistente).
#
# Alertas de vulnerabilidade (security updates) NÃO respeitam `schedule` nem os grupos:
# o Dependabot abre PR assim que o advisory sai, que é o comportamento desejado.
version: 2

updates:
  # ── JS/TS do monorepo ──────────────────────────────────────────────────────
  # `bun` como package-ecosystem lê o bun.lock e cobre todos os workspaces a partir da raiz.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # Espera antes de propor uma versão recém-publicada: a janela em que um pacote
    # comprometido é publicado, detectado e despublicado costuma ser de horas a dias.
    # Atualização de SEGURANÇA ignora o cooldown e vem na hora, que é o certo.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Sem `ignore` hoje: os três pins que existiam aqui (`vite` >=8.2, `@types/node`
    # >=26.1, `h3` >rc.22) eram todos o MESMO defeito — uma segunda cópia do pacote na
    # árvore, não a versão nova. Com o pin exato fora dos apps o bun resolve uma cópia
    # só e o typecheck passa. Antes de pinar de novo, confira quantas cópias o
    # bun.lock resolve; pin exato num app é o que CRIA a segunda quando uma
    # transitiva flutua (foi o vitest arrastando o próprio vite).

    # `xlsx` NÃO é rastreado por aqui e isso é de propósito: ele vem do tarball
    # oficial da SheetJS (cdn.sheetjs.com), não do registry. A SheetJS parou de
    # publicar no npm no 0.19 e o que ficou lá (0.18.5) carrega duas high sem
    # correção possível. O dependabot não abre PR para dependência por URL, então
    # subir de versão é MANUAL: conferir https://cdn.sheetjs.com/ e trocar a URL
    # nos package.json de apps/api e apps/sucont. A integridade sha512 do tarball
    # fica gravada no bun.lock (Bun 1.4), então a troca não passa despercebida.
    groups:
      # Um PR por família: subir React/TanStack/etc. peça por peça só cria conflito de peer.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tanstack:
        patterns: ["@tanstack/*"]
      supabase:
        patterns: ["@supabase/*", "supabase", "drizzle-orm", "drizzle-kit", "postgres"]
      tooling:
        patterns: ["@biomejs/*", "turbo", "typescript", "vite", "vitest", "@vitejs/*", "knip", "husky", "commitizen", "cz-git", "@commitlint/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  # Action comprometida = execução arbitrária num runner que assume role AWS via OIDC.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # Espera antes de propor uma versão recém-publicada: a janela em que um pacote
    # comprometido é publicado, detectado e despublicado costuma ser de horas a dias.
    # Atualização de SEGURANÇA ignora o cooldown e vem na hora, que é o certo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # ── Imagem base do Docker ──────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # Espera antes de propor uma versão recém-publicada: a janela em que um pacote
    # comprometido é publicado, detectado e despublicado costuma ser de horas a dias.
    # Atualização de SEGURANÇA ignora o cooldown e vem na hora, que é o certo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
