# Atualização automática de dependências.
#
# Escopo deliberadamente estreito: só ecossistemas onde uma versão desatualizada é risco
# de segurança, e agrupado para não gerar 20 PRs por semana (o volume é o que mata a
# adoção do Dependabot — PR ignorado é pior que PR inexistente).
#
# Alertas de vulnerabilidade (security updates) NÃO respeitam `schedule` nem os grupos:
# o Dependabot abre PR assim que o advisory sai, que é o comportamento desejado.
version: 2

updates:
  # ── JS/TS do monorepo ──────────────────────────────────────────────────────
  # `bun` como package-ecosystem lê o bun.lock e cobre todos os workspaces a partir da raiz.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # Espera antes de propor uma versão recém-publicada: a janela em que um pacote
    # comprometido é publicado, detectado e despublicado costuma ser de horas a dias.
    # Atualização de SEGURANÇA ignora o cooldown e vem na hora, que é o certo.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # `@types/node` >= 26.1.1 quebra o typecheck do sisub-mcp: o `IncomingMessage`
      # dele passa a exigir `signal`, e o `@modelcontextprotocol/sdk` traz uma cópia
      # aninhada de `@types/node` que não tem — os dois tipos deixam de ser
      # compatíveis e `src/index.ts` para de compilar (TS2741/TS2345).
      # O PR #111 segurou isso só via lockfile, e o #184 provou que lockfile não
      # segura nada: `^26.0.0` reresolve para 26.1.x no primeiro install. Daí o par
      # pin exato nos package.json + este ignore. Remover quando o SDK do MCP subir
      # a cópia aninhada dele.
      - dependency-name: "@types/node"
        versions: [">=26.1.0"]
      # `vite` >= 8.2.0 quebra o typecheck dos 6 apps que usam `@rolldown/plugin-babel`
      # (todos menos o docs): o plugin traz a própria cópia de vite, e sob 8.2.x o
      # `Plugin` dele deixa de ser o `Plugin` do app — o array de `plugins` no
      # `vite.config.ts` para de casar com `PluginOption` (TS2321/TS2769). Não é o
      # config: `await` no plugin não resolve, porque o tipo vem da outra cópia.
      # `@rolldown/plugin-babel@0.2.3` é a última publicada e ainda não acompanha o
      # 8.2. Por isso o pin exato `"vite": "8.1.5"` nos apps. Remover os dois quando
      # o plugin publicar versão que aceite vite 8.2.
      - dependency-name: "vite"
        versions: [">=8.2.0"]
    groups:
      # Um PR por família: subir React/TanStack/etc. peça por peça só cria conflito de peer.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tanstack:
        patterns: ["@tanstack/*"]
      supabase:
        patterns: ["@supabase/*", "supabase", "drizzle-orm", "drizzle-kit", "postgres"]
      tooling:
        patterns: ["@biomejs/*", "turbo", "typescript", "vite", "vitest", "@vitejs/*", "knip", "husky", "commitizen", "cz-git", "@commitlint/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  # Action comprometida = execução arbitrária num runner que assume role AWS via OIDC.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # Espera antes de propor uma versão recém-publicada: a janela em que um pacote
    # comprometido é publicado, detectado e despublicado costuma ser de horas a dias.
    # Atualização de SEGURANÇA ignora o cooldown e vem na hora, que é o certo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # ── Imagem base do Docker ──────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # Espera antes de propor uma versão recém-publicada: a janela em que um pacote
    # comprometido é publicado, detectado e despublicado costuma ser de horas a dias.
    # Atualização de SEGURANÇA ignora o cooldown e vem na hora, que é o certo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
