# ============================================================================
# Integração sisub contra o BANCO REAL (preferência do projeto: realismo do
# banco > isolamento de container — layout de extensões, cache do PostgREST e
# histórico real de migrations só existem no banco de verdade).
#
# Duas camadas:
#   gate (bloqueante)  — testes TRANSACIONAIS com rollback (sql.begin +
#                        savepoints): seguros contra produção por construção,
#                        serializados (--no-file-parallelism) e com
#                        SISUB_INTEGRATION_REQUIRED=true — credencial ausente
#                        é FALHA, nunca skip verde.
#   full (visibilidade) — suíte completa de operations (inclui os arquivos
#                        seed-cleanup ainda não-transacionais). Não bloqueia o
#                        merge até cada arquivo migrar pro padrão rollback
#                        (change sisub-test-coverage-ci-hardening, task 2.3);
#                        ao migrar, mover o arquivo para o script
#                        test:integration:gate.
#
# Onde cada camada roda:
#   - PR: só o `gate`, bloqueante — é check obrigatório do ruleset da `main`. O workflow dispara
#     em TODO PR e o `changes` decide, porque check obrigatório que não roda deixa o PR esperando
#     para sempre; job pulado por `if:` conta como verde. Fila por PR: push novo cancela o run
#     anterior do mesmo PR. (Antes o grupo era um só para o repo, e o GitHub guarda UM pendente
#     por grupo: de 99 runs, 62 cancelados, 29 sem nunca começar.)
#   - push na `main`: `gate` + `full`, como monitor. Não segura deploy nenhum (o deploy.yml não
#     roda integração); vermelho aqui é regressão a corrigir. É onde o Dependabot, que não recebe
#     segredo no PR, é testado.
#   - workflow_dispatch: as duas camadas, para rodar a suíte inteira numa branch antes do merge.
#
# O `full` tem a trava global `sisub-integration-real-db`: os arquivos seed-cleanup não suportam
# duas execuções no mesmo banco. O gate é rollback, seguro em paralelo como tráfego real. Na
# trava cabe um pendente: commit novo na `main` substitui o pendente mais velho, e o resultado
# do mais novo cobre os dois.
#
# Rede de segurança do `full`: o cleanup das fixtures vive num `afterEach`, que NÃO roda quando
# o job é cancelado (SIGKILL no vitest). Foi assim que duas receitas `[TEST]` ficaram visíveis em
# /global/recipes. Por isso `scripts/purge-test-fixtures.ts` roda antes e depois da suíte.
# ============================================================================
name: sisub integration (real db)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sisub-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      db: ${{ steps.scope.outputs.db }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Mesmo escopo que decide o deploy do sisub (paths-filter.yml, gerado do grafo de
      # workspace), mais o que só este workflow enxerga.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: sisub
        with:
          filters: .github/paths-filter.yml
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: extra
        with:
          filters: |
            extra:
              - '.github/workflows/integration.yml'
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          SISUB: ${{ steps.sisub.outputs.sisub }}
          EXTRA: ${{ steps.extra.outputs.extra }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$SISUB" = "true" ] || [ "$EXTRA" = "true" ]; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: gate (transacionais + ciclo e2e)
    needs: changes
    runs-on: ubuntu-latest
    # Falha fechado: se o `changes` quebrar, o gate roda em vez de pular verde.
    # Sem segredo não há gate: PR de fork e do Dependabot pulam em vez de falhar por infra, e são
    # testados no push da `main`.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.db == 'true') &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Grants do banco: função nossa executável por cliente, função que o
      # service_role não executa, default que faz função NOVA nascer aberta, RLS e
      # SECURITY DEFINER. Lê só o catálogo. Roda aqui, e não só no agendamento do
      # security.yml, porque toda migration passa por este workflow
      # (`packages/database/**`) e é aplicada ANTES do merge — o gate vê o efeito
      # dela no banco, qualquer que seja o SQL que o causou.
      - name: Audit database grants and RLS
        env:
          SISUB_DATABASE_URL: ${{ secrets.SISUB_DATABASE_URL }}
        run: bun --filter @iefa/database audit:rls
      - name: Run transactional integration gate
        working-directory: apps/sisub
        env:
          SISUB_DATABASE_URL: ${{ secrets.SISUB_DATABASE_URL }}
          SISUB_SUPABASE_SECRET_KEY: ${{ secrets.SISUB_SUPABASE_SECRET_KEY }}
          VITE_SISUB_SUPABASE_URL: ${{ vars.VITE_SISUB_SUPABASE_URL }}
          VITE_SISUB_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SISUB_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run test:integration:gate

  full:
    name: full suite (monitor)
    runs-on: ubuntu-latest
    needs: gate
    if: github.event_name != 'pull_request'
    continue-on-error: true
    timeout-minutes: 25
    concurrency:
      group: sisub-integration-real-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Varre fixtures `[TEST]` que sobraram de uma execução anterior morta no meio (job
      # cancelado → SIGKILL no vitest → nenhum afterEach roda). Antes da suíte porque este
      # passo SEMPRE executa; o pós-suíte abaixo pode ser interrompido junto com o job.
      # `continue-on-error` porque é rede de segurança, não gate: se a faxina falhar e o passo
      # abortar o job, a suíte não roda e o `continue-on-error: true` do job pinta tudo de verde —
      # o run de integração vazio que este repo já levou uma vez.
      - name: Purge leftover test fixtures (pre)
        continue-on-error: true
        working-directory: apps/sisub
        env:
          SISUB_DATABASE_URL: ${{ secrets.SISUB_DATABASE_URL }}
        run: bun run scripts/purge-test-fixtures.ts --apply
      - name: Run full integration suite
        working-directory: apps/sisub
        env:
          SISUB_DATABASE_URL: ${{ secrets.SISUB_DATABASE_URL }}
          SISUB_SUPABASE_SECRET_KEY: ${{ secrets.SISUB_SUPABASE_SECRET_KEY }}
          VITE_SISUB_SUPABASE_URL: ${{ vars.VITE_SISUB_SUPABASE_URL }}
          VITE_SISUB_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SISUB_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run test:integration -- --no-file-parallelism
      - name: Purge leftover test fixtures (post)
        if: always()
        working-directory: apps/sisub
        env:
          SISUB_DATABASE_URL: ${{ secrets.SISUB_DATABASE_URL }}
        run: bun run scripts/purge-test-fixtures.ts --apply
