# CI/CD — push na `main` (e dispatch): o que mudou → verificação → build e deploy por app.
#
#   plan ──► verify ──► release <app>  (matriz: build ► deploy, um por app que passou)
#      │        └─────► build-docs ► deploy-docs  (site estático)
#      └──► warm-deps (cache do `bun install` dos builds, em paralelo com o verify)
#
# Quais apps existem, de onde sai a imagem, a URL do smoke test e as tarefas que liberam cada
# app vêm do apps.manifest.json; os scripts/release-*.ts leem o manifesto. App novo é uma
# entrada lá e `bun run generate:deploy`, sem editar este arquivo. Mapa geral dos workflows em
# .github/workflows/README.md.
name: CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps a publicar sem commit novo: `all` ou chaves do apps.manifest.json separadas por vírgula (ex.: sisub,portal)"
        required: true
        type: string

# id-token: write só no `release` (build e deploy assumem a role de deploy AWS por OIDC, sem
# chave estática). O `verify` roda código de teste e não recebe a role, que confia em qualquer
# job da `main`.
permissions:
  contents: read

jobs:
  # ============================================================
  # PLAN ── quais apps este run publica
  # ============================================================
  plan:
    # Fica na Blacksmith apesar de durar segundos: é o início do caminho crítico, e no GitHub
    # disputaria os 20 jobs simultâneos do plano gratuito com o tráfego dos PRs.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      monorepo: ${{ steps.plan.outputs.monorepo }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Os filtros saem do apps.manifest.json + o grafo de workspace de cada app
      # (`bun run generate:deploy`). No dispatch o resultado é ignorado.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/paths-filter.yml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Resolve apps
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
          DISPATCH_APPS: ${{ inputs.apps }}
        run: bun scripts/release-plan.ts

  # ============================================================
  # VERIFY ── lint · typecheck · teste do resultado do merge, num job só
  # ============================================================
  # Repete na `main` o que o PR já checou porque o ruleset não exige branch atualizada: dois PRs
  # verdes podem quebrar juntos depois do merge. Uma invocação do turbo cobre as tarefas de todos
  # os apps do plano (`check` no manifesto; padrão lint, typecheck e test do workspace) e os testes
  # de todo package, que rodam sempre: o guard do inventário de cookies varre `apps/*`. O
  # resultado é por app (tabela no resumo do job): app vermelho não segura o deploy dos outros, e
  # o job fica vermelho para alguém ver.
  #
  # Sem segredo: teste unitário não lê credencial. A integração roda no integration.yml, fora do
  # caminho do deploy. As `VITE_*` são os valores públicos que vão no bundle.
  verify:
    needs: [plan]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    outputs:
      release: ${{ steps.verify.outputs.release }}
      docs: ${{ steps.verify.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint · types · tests
        id: verify
        run: bun scripts/release-verify.ts
        env:
          APPS: ${{ needs.plan.outputs.apps }}
          VITE_IEFA_SUPABASE_URL: ${{ vars.VITE_IEFA_SUPABASE_URL }}
          VITE_IEFA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_IEFA_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SISUB_SUPABASE_URL: ${{ vars.VITE_SISUB_SUPABASE_URL }}
          VITE_SISUB_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SISUB_SUPABASE_PUBLISHABLE_KEY }}
          VITE_RUMAER_SUPABASE_URL: ${{ vars.VITE_SISUB_SUPABASE_URL }}
          VITE_RUMAER_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SISUB_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ASSIGNMENT_SELECTION_SUPABASE_URL: ${{ vars.VITE_SISUB_SUPABASE_URL }}
          VITE_ASSIGNMENT_SELECTION_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SISUB_SUPABASE_PUBLISHABLE_KEY }}

  # ============================================================
  # WARM DEPS CACHE
  # Builda o estágio `deps` uma vez e popula o scope `deps` do cache gha.
  # Os builds do `release` dependem deste job e leem esse cache → o `bun install`
  # do monorepo não é refeito por app em cache frio.
  # ============================================================
  warm-deps:
    needs: [plan]
    if: needs.plan.outputs.monorepo == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Mesma segunda tentativa do build do _release.yml: o buildkit às vezes perde o processo
      # de um passo trivial (`exit code: 4294967295`), e um warm-deps vermelho derruba o build
      # de todos os apps do run.
      - name: Warm deps cache
        id: bake
        continue-on-error: true
        timeout-minutes: 8
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with: &warm-deps-with
          files: ./docker-bake.hcl
          targets: deps
          push: false
      - name: Warm deps cache (retry)
        if: steps.bake.outcome == 'failure'
        timeout-minutes: 6
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with: *warm-deps-with

  # ============================================================
  # RELEASE ── build ► deploy, um por app que passou no verify
  # ============================================================
  # `!cancelled()`: o `verify` vermelho por causa de UM app ainda libera os outros (a matriz só
  # tem os que passaram). `warm-deps` pulado (só o pdf mudou) não bloqueia; falhado, sim, porque
  # todo build do monorepo depende do cache dele.
  release:
    name: release ${{ matrix.key }}
    needs: [plan, verify, warm-deps]
    if: >-
      ${{ !cancelled()
        && (needs.verify.result == 'success' || needs.verify.result == 'failure')
        && needs.verify.outputs.release != '' && needs.verify.outputs.release != '[]'
        && needs.warm-deps.result != 'failure' && needs.warm-deps.result != 'cancelled' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.verify.outputs.release) }}
    uses: ./.github/workflows/_release.yml
    with:
      service: ${{ matrix.key }}
      health_url: ${{ matrix.health_var && vars[matrix.health_var] || '' }}
      timeout_minutes: ${{ matrix.build_timeout }}
      bake_attempt_timeout_minutes: ${{ matrix.attempt_timeout }}
    secrets:
      # Só o sisub declara o secret no docker-bake.hcl; os outros builds nem o recebem.
      FARO_SOURCEMAP_API_KEY: ${{ matrix.key == 'sisub' && secrets.FARO_SOURCEMAP_API_KEY || '' }}

  # ============================================================
  # DOCS ── site estático (S3 + CloudFront), fora da matriz do ECS
  # ============================================================
  build-docs:
    needs: [verify]
    if: ${{ !cancelled() && needs.verify.outputs.docs == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bunx turbo run build --filter=./apps/docs

      # O prerender do Nitro NÃO falha o build quando uma rota lança: ele registra
      # o erro, para de seguir os links daquela página e segue em frente. O sync
      # abaixo usa --delete, então um prerender truncado APAGA do bucket as páginas
      # que ainda estavam lá — foi assim que /docs/** sumiu de produção com o build
      # verde (um helper do tslib que deixou de resolver derrubou o render de /docs/,
      # e das 23 rotas só 8 saíram). Conferir antes de sincronizar transforma isso
      # num deploy vermelho em vez de num site vazio.
      - name: Verify prerender output
        run: |
          set -euo pipefail
          cd apps/docs
          test -f .output/public/docs/index.html || {
            echo "::error::prerender não gerou docs/index.html — abortando antes do sync --delete"
            exit 1
          }
          pages=$(find .output/public -name 'index.html' | wc -l)
          echo "páginas prerenderizadas: $pages"
          [ "$pages" -ge 12 ] || {
            echo "::error::só $pages páginas prerenderizadas (esperado >= 12) — prerender truncado, abortando"
            exit 1
          }

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: apps/docs/.output/public
          if-no-files-found: error
          include-hidden-files: true
          # "Re-run all jobs" sobe de novo com o mesmo nome no mesmo run.
          overwrite: true
          # Folga para um "Re-run failed jobs" do deploy-docs dias depois.
          retention-days: 7

  deploy-docs:
    needs: [build-docs]
    # Sync para o S3 + invalidação do CloudFront: rede e espera, não CPU (como o `deploy` do
    # _release.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    # Sem cancelar, como os deploys do ECS: cancelar entre os dois `s3 sync --delete` deixa o
    # HTML novo apontando para assets que ainda não subiram, sem invalidação nem smoke test.
    concurrency:
      group: static-deploy-docs
      cancel-in-progress: false
    steps:
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site

      # Segunda conferência, agora sobre o que vai de fato para o bucket: um artifact
      # truncado no upload/download também apagaria páginas no sync --delete.
      - name: Verify downloaded site
        run: |
          set -euo pipefail
          test -f site/docs/index.html || { echo "::error::artifact sem docs/index.html"; exit 1; }
          pages=$(find site -name 'index.html' | wc -l)
          [ "$pages" -ge 12 ] || { echo "::error::artifact com só $pages páginas"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # O build-docs não é serializado: com dois merges seguidos, o build do mais novo pode
      # terminar antes e o deploy do mais velho publicar por cima depois. O bucket guarda a
      # revisão publicada em `.deploy-revision`; se ela já é mais nova que este commit, este
      # deploy não publica. Falha na leitura ou na comparação publica (o comportamento de
      # antes), como o `scripts/decide-latest-tag.sh` dos apps.
      - name: Decide whether to publish
        id: order
        env:
          BUCKET: ${{ vars.DOCS_S3_BUCKET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Sem `|| true`, o `-e` do shell do Actions encerra o passo quando o objeto ainda não
          # existe (primeira publicação): o `pipefail` propaga a falha do `aws s3 cp`.
          published="$(aws s3 cp "s3://$BUCKET/.deploy-revision" - 2>/dev/null | tr -dc '0-9a-f' || true)"
          publish=true
          if [ -n "$published" ] && [ "$published" != "$GITHUB_SHA" ]; then
            status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${published}...${GITHUB_SHA}" --jq .status 2>/dev/null || echo unknown)"
            echo "publicado: $published, este: $GITHUB_SHA, comparação: $status"
            if [ "$status" = "behind" ]; then
              publish=false
              echo "::warning::o bucket já tem $published, mais novo que este commit — não publico"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # Dois syncs porque a política de cache difere. Os arquivos em assets/ têm
      # hash no nome, então podem ser imutáveis; HTML e índices precisam
      # revalidar a cada visita, senão uma publicação nova demora a aparecer.
      # Cada sync usa --delete apenas dentro do seu escopo (o --exclude protege
      # assets/ de ser apagado pelo primeiro).
      - name: Publish to S3
        if: steps.order.outputs.publish == 'true'
        env:
          BUCKET: ${{ vars.DOCS_S3_BUCKET }}
        run: |
          set -euo pipefail
          cd site

          aws s3 sync . "s3://$BUCKET" --delete \
            --exclude "assets/*" \
            --exclude ".deploy-revision" \
            --cache-control "public, max-age=0, must-revalidate"

          aws s3 sync ./assets "s3://$BUCKET/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"

          # O prerender materializa /api/docs-index e /api/search sem extensão, e
          # o S3 marca extensionless como binary/octet-stream. A compressão
          # automática do CloudFront só atua sobre content-types conhecidos, então
          # sem esta correção o índice de busca (564 KB) desceria inteiro em vez
          # dos ~64 KB comprimidos.
          for f in docs-index search; do
            aws s3 cp "./api/$f" "s3://$BUCKET/api/$f" \
              --content-type application/json \
              --cache-control "public, max-age=0, must-revalidate"
          done

          printf '%s' "$GITHUB_SHA" | aws s3 cp - "s3://$BUCKET/.deploy-revision" \
            --content-type text/plain --cache-control "no-store"

      - name: Invalidate CloudFront
        if: steps.order.outputs.publish == 'true'
        env:
          DISTRIBUTION_ID: ${{ vars.DOCS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' >/dev/null

      - name: Smoke test
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
        run: |
          set -euo pipefail
          for path in / /docs/ /api/search; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 \
              --retry-all-errors "${DOCS_URL}${path}")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::${path} respondeu $code"; exit 1; }
          done
