# Reusable: aplica UM stack Terraform. Chamado por terraform-apply.yml.
#
# Sempre roda `plan -detailed-exitcode` antes: exitcode 0 = nada a fazer (sai sem
# aplicar e sem tocar em nada), 2 = há diff (aplica o plano SALVO, não um replan —
# assim o que sai é exatamente o que foi impresso no log), 1 = erro.
name: terraform-apply-stack

on:
  workflow_call:
    inputs:
      stack:
        description: "Nome do diretório em infra/ (ex: foundation, sisub)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # cancel-in-progress: false de propósito — cancelar um apply no meio deixa o
    # lock do DynamoDB pendurado e o state possivelmente divergente do real.
    concurrency:
      group: tf-apply-${{ inputs.stack }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Materialize tfvars from secret
        id: tfvars
        env:
          TF_TFVARS_JSON: ${{ secrets.TF_TFVARS_JSON }}
          STACK: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          content="$(jq -r --arg s "$STACK" '.[$s] // ""' <<<"${TF_TFVARS_JSON:-{}}")"
          if [ -z "$content" ]; then
            # Sem tfvars não dá para aplicar: as variáveis do stack ficariam vazias
            # e o plan tentaria destruir/recriar recursos com defaults. Falha alto —
            # silenciar aqui é como o apply manual sumiu antes.
            echo "::error::TF_TFVARS_JSON não tem entrada para o stack '$STACK' — apply abortado."
            exit 1
          fi
          printf '%s\n' "$content" > "infra/$STACK/terraform.tfvars"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Third-party action → hash-pinned per .github/zizmor.yml (Dependabot bumps it).
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform init
        env:
          STACK: ${{ inputs.stack }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_DYNAMODB_TABLE: ${{ vars.TF_STATE_DYNAMODB_TABLE }}
        run: |
          set -euo pipefail
          cd "infra/$STACK"
          cp backend.tf.example backend.tf
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="dynamodb_table=$TF_STATE_DYNAMODB_TABLE"

      - name: Terraform plan
        id: plan
        env:
          STACK: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          cd "infra/$STACK"
          set +e
          terraform plan -input=false -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "Sem mudanças em $STACK — nada a aplicar." ;;
            2) echo "Há mudanças em $STACK — aplicando." ;;
            *) echo "::error::terraform plan falhou para $STACK"; exit 1 ;;
          esac

      - name: Terraform apply
        if: steps.plan.outputs.exitcode == '2'
        env:
          STACK: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          cd "infra/$STACK"
          terraform apply -input=false -lock-timeout=5m -no-color tfplan

      - name: Job summary
        if: always()
        env:
          STACK: ${{ inputs.stack }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          case "${EXITCODE:-}" in
            0) result="sem mudanças" ;;
            2) result="aplicado" ;;
            *) result="falhou" ;;
          esac
          echo "### terraform apply — \`$STACK\`: $result" >> "$GITHUB_STEP_SUMMARY"
