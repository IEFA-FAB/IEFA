# Lint · typecheck · testes unitários · build NO PULL REQUEST, antes do merge. O nome do job
# (`lint · typecheck · test`) é check obrigatório do ruleset e não muda por causa do build.
#
# Até aqui esses gates só existiam nos jobs `check-<app>` do `deploy.yml`, que dispara em
# push na `main`: o erro aparecia depois do merge, e o deploy do app ficava `skipped`.
# Medido de 2026-07-29 a 2026-09-23: 59 de 273 pushes na `main` (21,6%) com o CI/CD
# vermelho. Lint, typecheck, teste unitário e contrato respondem por ~21 desses runs, e
# todos eram visíveis num PR.
#
# Escopo: `turbo --affected` contra a base do PR, com o grafo de workspace (package
# alterado arrasta os apps que o consomem). Mudança em arquivo global (lockfile, biome,
# turbo, tsconfig base, este workflow) roda tudo.
#
# Sem segredo nenhum, de propósito: roda igual em PR de fork, e teste que precisa de
# credencial é teste de integração, que tem o próprio workflow (`integration.yml`). As
# `vars` abaixo são as mesmas que os `check-<app>` recebem e que já vão no bundle público.
name: pr-check

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Os `lint` dos apps são `biome lint`: formatação só era cobrada pelo pre-commit, que não
      # existe em worktree sem `bun install` nem em commit feito pela interface do GitHub.
      - name: Format
        run: bun run format:check

      # Fora dos workspaces: o turbo não enxerga, e um guard quebrado só apareceria em sessão real.
      - name: Agent guard cases
        run: bun test ./.claude/hooks/guard.test.ts

      # Arquivo morto: nenhum entry o alcança. Só a categoria `files`, que está zerada; exports e
      # dependências sem uso (centenas, muitos falsos positivos de runtime) seguem advisory em
      # `bun run knip`. O #564 apagou uma leva de arquivos mortos que ninguém via. ~8 s.
      - name: Unused files (knip)
        run: bun run knip:files

      - name: Resolve scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(bun\.lock|package\.json|biome\.json|turbo\.json|bunfig\.toml|packages/tsconfig/|\.oxlintrc\.tailwind\.jsonc$|scripts/lint-tailwind\.ts$|\.github/workflows/pr-check\.yml$)'; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Arquivo global alterado: rodando o monorepo inteiro."
          else
            echo "args=--affected" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint · typecheck · test
        run: bunx turbo run lint typecheck test ${SCOPE_ARGS:+"$SCOPE_ARGS"} --concurrency=4 --continue
        env: &turbo-env
          SCOPE_ARGS: ${{ steps.scope.outputs.args }}
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          VITE_IEFA_SUPABASE_URL: ${{ vars.VITE_IEFA_SUPABASE_URL }}
          VITE_IEFA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_IEFA_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SISUB_SUPABASE_URL: ${{ vars.VITE_SISUB_SUPABASE_URL }}
          VITE_SISUB_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SISUB_SUPABASE_PUBLISHABLE_KEY }}
          VITE_RUMAER_SUPABASE_URL: ${{ vars.VITE_SISUB_SUPABASE_URL }}
          VITE_RUMAER_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SISUB_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ASSIGNMENT_SELECTION_SUPABASE_URL: ${{ vars.VITE_SISUB_SUPABASE_URL }}
          VITE_ASSIGNMENT_SELECTION_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SISUB_SUPABASE_PUBLISHABLE_KEY }}

      # O build pega o que typecheck e teste não pegam: o import-protection do TanStack Start
      # (`*.server.*` alcançado pelo grafo do cliente) só existe no `vite build`. Sem este passo
      # ele aparecia no `buildx bake` da `main`, depois do merge: 5 das 7 falhas de build do
      # CI/CD entre 2026-09-09 e 2026-09-28, quatro seguidas em 2026-09-26/27 no sisub.
      # Passo separado, e não mais uma task no turbo acima, para limitar a dois `vite build` ao
      # mesmo tempo (~3,3 GB de RSS cada no sisub). Roda mesmo que o passo acima falhe: são
      # sinais independentes. O resultado é descartado; a imagem continua saindo do Dockerfile.
      - name: Build
        if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
        run: bunx turbo run build ${SCOPE_ARGS:+"$SCOPE_ARGS"} --concurrency=2 --continue
        # As mesmas `VITE_*` do passo acima (e que o bake de produção passa como build arg):
        # sem elas o build do PR seria outro artefato, com outro grafo depois do tree-shaking.
        env: *turbo-env
