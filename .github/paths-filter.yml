  - 'packages/legal-kit/**'
  - 'packages/pbac/**'
  - 'packages/sisub-domain/**'
  - 'packages/supabase-kit/**'
  - 'packages/tsconfig/**'
  - 'Dockerfile'
  - 'docker-bake.hcl'
  - 'apps.manifest.json'
  - '.github/paths-filter.yml'
  - '.github/workflows/deploy.yml'
  - '.github/workflows/_app-build.yml'
  - '.github/workflows/_app-deploy.yml'
  - 'package.json'
